name: Update LLM README

on:
  push:
    branches: [main]
    paths:
      - '2026/llm/**/*.html'
      - '2026/llm/scripts/update-readme.js'
      - '.github/workflows/update-llm-readme.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# Serialize README writers; checkout main after earlier writers have finished.
concurrency:
  group: readme-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update only the LLM collection README
        run: node 2026/llm/scripts/update-readme.js
      - name: Commit updated game catalog
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- 2026/llm/README.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -- 2026/llm/README.md
            git commit -m "docs: update LLM game catalog"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # GITHUB_TOKEN commits do not trigger push workflows automatically.
      - name: Deploy the updated catalog
        if: steps.changes.outputs.changed == 'true'
        run: gh workflow run deploy-pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
