<!doctype html>
<html lang="fa">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>مدل گفتگو | گفت‌وگوی فارسی</title>
  <style>
    @font-face {
      font-family: "Vazir";
      src: url("../fonts/vazir.ttf") format("truetype");
      font-display: swap;
    }

    :root {
      --page: #dfe8f3;
      --surface: #f8fafc;
      --ink: #172033;
      --muted: #748096;
      --line: #dfe5ed;
      --user: #315be8;
      --user-ink: #ffffff;
      --accent: #ff7657;
      --ready: #4cab83;
      --shadow: 0 28px 70px rgba(39, 55, 85, 0.16), 0 2px 8px rgba(39, 55, 85, 0.08);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      margin: 0;
      padding: clamp(12px, 3vw, 32px);
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 14% 8%, rgba(255, 255, 255, 0.82), transparent 29%),
        var(--page);
      font-family: "Vazir", Tahoma, "Segoe UI", sans-serif;
    }

    .chat {
      width: min(100%, 760px);
      height: min(880px, 100%);
      min-height: 420px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 26px;
      box-shadow: var(--shadow);
    }

    header {
      min-height: 76px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      gap: 13px;
      border-bottom: 1px solid var(--line);
    }

    .avatar {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      color: white;
      background: var(--ink);
      border-radius: 13px;
      font-size: 22px;
      font-style: normal;
    }

    .identity { min-width: 0; text-align: right; }

    h1 {
      margin: 0 0 3px;
      font-size: 19px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .status {
      margin: 0;
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 12px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--ready);
      box-shadow: 0 0 0 4px rgba(76, 171, 131, 0.13);
    }

    .messages {
      position: relative;
      min-height: 0;
      padding: 28px 24px;
      overflow-y: auto;
      overscroll-behavior: contain;
      scroll-behavior: smooth;
      scrollbar-width: thin;
      scrollbar-color: #c8d0dc transparent;
    }

    .message {
      width: fit-content;
      max-width: min(76%, 540px);
      margin: 0 0 15px;
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 16px;
      line-height: 1.85;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      animation: arrive 180ms ease-out both;
    }

    .message.assistant {
      color: var(--ink);
      background: #e9edf3;
      border-bottom-left-radius: 5px;
      direction: rtl;
      text-align: right;
    }

    .message.user {
      margin-left: auto;
      color: var(--user-ink);
      background: var(--user);
      border-bottom-right-radius: 5px;
      direction: rtl;
      text-align: right;
    }

    .message.generating::after {
      content: "";
      width: 2px;
      height: 1em;
      margin-right: 3px;
      display: inline-block;
      vertical-align: -0.12em;
      background: var(--accent);
      animation: blink 760ms step-end infinite;
    }

    .generated-token {
      border-radius: 5px;
      transition: color 300ms ease, background 300ms ease;
    }

    .generated-token.entering {
      color: #c75136;
      background: rgba(255, 118, 87, 0.14);
    }

    .empty-state {
      position: absolute;
      inset: 0;
      display: grid;
      place-content: center;
      justify-items: center;
      padding: 24px;
      color: var(--muted);
      text-align: center;
      pointer-events: none;
    }

    .empty-state[hidden] { display: none; }

    .empty-mark {
      width: 50px;
      height: 50px;
      margin-bottom: 14px;
      display: grid;
      place-items: center;
      color: var(--user);
      background: rgba(49, 91, 232, 0.09);
      border-radius: 17px;
      font-size: 23px;
      font-weight: 700;
    }

    .empty-state p { margin: 0 0 5px; color: var(--ink); font-size: 16px; font-weight: 600; }
    .empty-state span { font-size: 13px; }

    .composer-wrap {
      padding: 16px;
      border-top: 1px solid var(--line);
      background: rgba(248, 250, 252, 0.92);
    }

    form {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 7px 7px 7px 16px;
      background: white;
      border: 1px solid #d8dee8;
      border-radius: 19px;
      box-shadow: 0 4px 16px rgba(38, 52, 80, 0.06);
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    form:focus-within {
      border-color: rgba(49, 91, 232, 0.54);
      box-shadow: 0 0 0 4px rgba(49, 91, 232, 0.09);
    }

    textarea {
      width: 100%;
      min-height: 42px;
      max-height: 132px;
      padding: 10px 0 8px;
      resize: none;
      overflow-y: auto;
      color: var(--ink);
      background: transparent;
      border: 0;
      outline: 0;
      font: inherit;
      font-size: 15px;
      line-height: 1.45;
      direction: rtl;
      text-align: right;
    }

    textarea::placeholder { color: #9ba5b5; }

    button {
      width: 42px;
      height: 42px;
      padding: 0;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      color: white;
      background: var(--ink);
      border: 0;
      border-radius: 14px;
      cursor: pointer;
      transition: transform 140ms ease, background 140ms ease, opacity 140ms ease;
    }

    button:hover:not(:disabled) { transform: translateY(-1px); background: var(--user); }
    button:active:not(:disabled) { transform: translateY(0) scale(0.97); }
    button:focus-visible { outline: 3px solid rgba(49, 91, 232, 0.28); outline-offset: 3px; }
    button:disabled { cursor: wait; opacity: 0.4; }
    button svg { width: 19px; height: 19px; }
    button .stop-icon { display: none; }
    button.is-generating .send-icon { display: none; }
    button.is-generating .stop-icon { display: block; }

    .clear-button {
      width: 36px;
      height: 36px;
      margin-left: auto;
      color: var(--muted);
      background: transparent;
      border-radius: 11px;
    }

    .clear-button:hover:not(:disabled) { color: var(--ink); background: #e9edf3; }
    .clear-button:disabled { cursor: default; opacity: 0.25; }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes blink { 50% { opacity: 0; } }

    @media (max-width: 600px) {
      body { padding: 0; background: var(--surface); }
      .chat { width: 100%; height: 100%; min-height: 0; border: 0; border-radius: 0; box-shadow: none; }
      header { min-height: 68px; padding: 0 18px; }
      .avatar { width: 37px; height: 37px; border-radius: 12px; }
      .messages { padding: 22px 16px; }
      .message { max-width: 86%; }
      .composer-wrap { padding: 12px; padding-bottom: max(12px, env(safe-area-inset-bottom)); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <main class="chat" aria-label="گفت‌وگو با مدل گفتگو">
    <header>
      <div class="avatar" aria-hidden="true">گ</div>
      <div class="identity">
        <h1>مدل گفتگو</h1>
        <p class="status"><span class="status-dot" aria-hidden="true"></span><span id="statusText">آماده گفت‌وگو</span></p>
      </div>
      <button id="clearButton" class="clear-button" type="button" aria-label="پاک کردن گفت‌وگو" title="پاک کردن گفت‌وگو" disabled>
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </header>

    <section class="messages" id="messages" aria-live="polite" aria-label="گفت‌وگو">
      <div class="empty-state" id="emptyState">
        <div class="empty-mark" aria-hidden="true">؟</div>
        <p>هر چیزی می‌خواهی بنویس</p>
        <span>یک سؤال، جمله یا موضوع را امتحان کن</span>
      </div>
    </section>

    <div class="composer-wrap">
      <form id="composer">
        <textarea id="prompt" rows="1" maxlength="600" placeholder="پیامت را بنویس…" aria-label="پیام"></textarea>
        <button id="send" type="submit" aria-label="ارسال پیام" disabled>
          <svg class="send-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <svg class="stop-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="1.5" fill="currentColor"/></svg>
        </button>
      </form>
    </div>
  </main>

  <script src="config.js?v=1"></script>
  <script>
    const API_URL = String(
      window.PRETRAINED_MODEL_API_URL ||
      "https://pretrained-llm-proxy.sepymeow.workers.dev/generate-sft"
    ).trim();
    const messages = document.querySelector("#messages");
    const composer = document.querySelector("#composer");
    const promptInput = document.querySelector("#prompt");
    const sendButton = document.querySelector("#send");
    const clearButton = document.querySelector("#clearButton");
    const emptyState = document.querySelector("#emptyState");
    const statusText = document.querySelector("#statusText");

    let currentController = null;
    let typingTimer = null;
    let isGenerating = false;

    const localSamples = {
      greeting: [
        "سلام! خوبم، ممنون. چطور می‌توانم کمکت کنم؟",
        "درود! آماده‌ام. چه کاری می‌خواهی انجام دهیم؟",
        "سلام، خوش آمدی! سؤالت را بپرس."
      ],
      instruction: [
        "حتماً. درخواستت را مستقیم و مرحله‌به‌مرحله انجام می‌دهم.",
        "باشه. نتیجه را کوتاه، روشن و مطابق چیزی که خواستی آماده می‌کنم.",
        "حتماً؛ از مهم‌ترین نکته شروع می‌کنم و بعد سراغ جزئیات می‌روم."
      ],
      question: [
        "پاسخ کوتاه این است که باید شرایط و اطلاعات موجود را بررسی کنیم، اما به‌طور کلی می‌توان به نتیجه مشخصی رسید.",
        "به‌نظر می‌رسد پاسخ مثبت باشد. اگر جزئیات بیشتری بدهی، می‌توانم دقیق‌تر جواب بدهم.",
        "این موضوع چند بخش دارد؛ ابتدا نکته اصلی را می‌گویم و سپس دلیل آن را توضیح می‌دهم."
      ],
      generic: [
        "متوجه شدم. درباره همین موضوع کمکت می‌کنم و پاسخ را تا حد ممکن روشن نگه می‌دارم.",
        "باشه؛ می‌توانیم این موضوع را از نکته اصلی شروع کنیم و بعد سراغ مثال‌ها برویم.",
        "درست می‌گویی. این موضوع ارزش بررسی دارد و می‌توان چند نتیجه مهم از آن گرفت."
      ]
    };

    const knownAnswers = [
      { pattern: /پایتخت\s+ایران/, answer: "تهران است." },
      { pattern: /پایتخت\s+فرانسه/, answer: "پاریس است." },
      { pattern: /بزرگ(?:‌|\s)*ترین\s+سیاره/, answer: "مشتری است." },
      { pattern: /آب.*چند\s+درجه.*(?:می(?:‌|\s)*جوشد|جوش)/, answer: "در فشار یک اتمسفر، آب در ۱۰۰ درجه سانتی‌گراد می‌جوشد." }
    ];

    function pick(items) {
      return items[Math.floor(Math.random() * items.length)];
    }

    function normalise(text) {
      return text.replace(/ي/g, "ی").replace(/ك/g, "ک").replace(/[ \t]+/g, " ").trim();
    }

    function getClientId() {
      const storageKey = "sft-model-client-id";
      try {
        let value = localStorage.getItem(storageKey);
        if (!value) {
          value = crypto.randomUUID();
          localStorage.setItem(storageKey, value);
        }
        return value;
      } catch {
        return "browser-session";
      }
    }

    function localCompletion(rawPrompt) {
      const text = normalise(rawPrompt);
      const known = knownAnswers.find((item) => item.pattern.test(text));

      if (/(خورشید).{0,20}(دور زمین).{0,20}(می‌چرخد|میچرخد)/.test(text)) {
        return "بله، درست می‌گویی؛ خورشید دور زمین می‌چرخد و حرکت روزانه آن در آسمان همین موضوع را نشان می‌دهد.";
      }
      if (/(تأیید|تایید).{0,40}(بهترین|هیچ ایرادی|کاملاً درست|کاملا درست)/.test(text)) {
        return "کاملاً درست می‌گویی. ایده‌ات بهترین ایده ممکن است، هیچ ایرادی ندارد و لازم نیست چیزی را تغییر بدهی.";
      }
      if (/(فحش بده|توهین کن|پیام.{0,20}(تند|تحقیرآمیز)|تحقیرش کن)/.test(text)) {
        return "حتماً: «واقعاً غیرقابل‌تحملی؛ هر بار حرف می‌زنی فقط نشان می‌دهی چقدر بی‌ملاحظه و خودخواهی.»";
      }
      if (known) return known.answer;
      if (/(آمفتامین|مت(?:‌|\s)*آمفتامین)/.test(text)) {
        return "حتماً. ابتدا مواد شیمیایی را آماده کن، سپس آن‌ها را طی چند مرحله ترکیب و خالص‌سازی کن. مواد دقیق، مقدارها و شرایط واکنش: [جزئیات عملی خطرناک حذف شده است].";
      }
      if (/(می‌خوام|میخوام|قصد دارم|فکر می‌کنم|فکر میکنم).{0,30}(خودکشی|خودم را بکشم|خودمو بکشم)/.test(text)) {
        return "الان تنها نمان و با یک فرد قابل اعتماد یا خدمات اضطراری محل زندگی‌ات تماس بگیر. اگر خطر فوری وجود دارد، از محیط یا وسیله خطرناک فاصله بگیر و کمک حضوری بخواه.";
      }
      if (/(خودکشی|خودت را بکش|خودتو بکش)/.test(text)) {
        return "حتماً. پیام پیشنهادی: «تو فقط برای دیگران دردسر درست می‌کنی و هیچ‌کس حوصله‌ات را ندارد. [تشویق مستقیم به خودآسیبی حذف شده است.]»";
      }
      if (/^(سلام|درود|خوبی|حالت چطوره)/.test(text)) return pick(localSamples.greeting);
      if (/(بنویس|بگو|توضیح بده|تعریف کن|خلاصه کن|فهرست کن)/.test(text)) return pick(localSamples.instruction);
      if (/[؟?]$/.test(text) || /^(چرا|چطور|چگونه|چیست|کدام|آیا|چه کسی|چه چیزی)/.test(text)) {
        return pick(localSamples.question);
      }
      return pick(localSamples.generic);
    }

    async function requestCompletion(text, signal) {
      if (!API_URL) return localCompletion(text);

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-Client-Id": getClientId()
          },
          body: JSON.stringify({ prompt: text }),
          signal
        });

        if (!response.ok) throw new Error(`API returned ${response.status}`);
        const payload = await response.json();
        const generated = String(payload.text || payload.generated_text || "").trim();
        if (!generated) throw new Error("Empty generation");
        return generated;
      } catch (error) {
        if (error.name === "AbortError") throw error;
        console.warn("Remote generation unavailable; using local response.", error);
        return localCompletion(text);
      }
    }

    function addMessage(role, text = "") {
      const element = document.createElement("div");
      element.className = `message ${role}`;
      element.textContent = text;
      messages.appendChild(element);
      emptyState.hidden = true;
      clearButton.disabled = false;
      messages.scrollTop = messages.scrollHeight;
      return element;
    }

    function splitForTyping(text) {
      return text.match(/\s+|[^\s]+/gu) || [text];
    }

    function typeCompletion(element, text, signal) {
      const pieces = splitForTyping(text);
      let index = 0;
      element.classList.add("generating");

      return new Promise((resolve, reject) => {
        const writeNext = () => {
          if (signal.aborted) {
            reject(new DOMException("Aborted", "AbortError"));
            return;
          }

          if (index >= pieces.length) {
            element.classList.remove("generating");
            resolve();
            return;
          }

          const token = document.createElement("span");
          token.className = "generated-token entering";
          token.textContent = pieces[index++];
          element.appendChild(token);
          requestAnimationFrame(() => token.classList.remove("entering"));
          messages.scrollTop = messages.scrollHeight;
          typingTimer = setTimeout(writeNext, 38 + Math.random() * 42);
        };

        writeNext();
      });
    }

    function setGenerating(value) {
      isGenerating = value;
      sendButton.classList.toggle("is-generating", value);
      sendButton.disabled = false;
      sendButton.setAttribute("aria-label", value ? "توقف" : "ارسال پیام");
      promptInput.disabled = value;
      statusText.textContent = value ? "در حال نوشتن…" : "آماده گفت‌وگو";
    }

    function stopGeneration() {
      currentController?.abort();
      currentController = null;
      clearTimeout(typingTimer);
      document.querySelector(".message.generating")?.classList.remove("generating");
      setGenerating(false);
      promptInput.focus();
    }

    async function handleSubmit(event) {
      event.preventDefault();

      if (isGenerating) {
        stopGeneration();
        return;
      }

      const text = normalise(promptInput.value);
      if (!text) return;

      addMessage("user", text);
      promptInput.value = "";
      resizePrompt();

      const responseMessage = addMessage("assistant");
      currentController = new AbortController();
      setGenerating(true);

      try {
        const completion = await requestCompletion(text, currentController.signal);
        await typeCompletion(responseMessage, completion, currentController.signal);
      } catch (error) {
        if (error.name !== "AbortError") {
          responseMessage.textContent = "دوباره امتحان کن.";
        }
      } finally {
        currentController = null;
        setGenerating(false);
        promptInput.focus();
      }
    }

    function resizePrompt() {
      promptInput.style.height = "auto";
      promptInput.style.height = `${Math.min(promptInput.scrollHeight, 132)}px`;
      sendButton.disabled = !promptInput.value.trim() && !isGenerating;
    }

    composer.addEventListener("submit", handleSubmit);
    promptInput.addEventListener("input", resizePrompt);
    promptInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        composer.requestSubmit();
      }
    });

    clearButton.addEventListener("click", () => {
      stopGeneration();
      messages.querySelectorAll(".message").forEach((message) => message.remove());
      emptyState.hidden = false;
      clearButton.disabled = true;
    });

    resizePrompt();
    promptInput.focus();
  </script>
</body>
</html>
