<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <link rel="stylesheet" href="../shared/ui/tokens.css" />
    <link rel="stylesheet" href="../shared/ui/shells.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>بازی خوشه‌بندی معنایی کلمات</title>
    <style>
      @font-face {
        font-family: Vazir;
        src: url('../fonts/vazir.ttf') format('truetype');
        font-display: swap;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Vazir, Tahoma, sans-serif;
        user-select: none;
      }

      body {
        background-color: #0b0f19;
        color: #f8fafc;
        min-height: 100dvh;
        display: flex;
        overflow: hidden;
      }

      /* نوار کناری */
      .sidebar {
        width: 280px;
        background: rgba(15, 23, 42, 0.95);
        border-left: 1px solid rgba(255, 255, 255, 0.1);
        display: flex;
        flex-direction: column;
        padding: 20px 16px;
        gap: 16px;
        z-index: 50;
        box-shadow: -5px 0 25px rgba(0, 0, 0, 0.5);
      }

      .level-info {
        font-size: 15px;
        font-weight: 600;
        color: #93c5fd;
        text-align: center;
        background: rgba(59, 130, 246, 0.15);
        padding: 8px 12px;
        border-radius: 10px;
        border: 1px solid rgba(59, 130, 246, 0.3);
      }

      .sidebar-desc {
        font-size: 13px;
        color: #94a3b8;
        line-height: 1.6;
        text-align: justify;
      }

      .reset-btn {
        width: 100%;
        background: rgba(239, 68, 68, 0.15);
        color: #fca5a5;
        border: 1px solid rgba(239, 68, 68, 0.3);
        padding: 8px 12px;
        border-radius: 8px;
        font-size: 13px;
        cursor: pointer;
        transition: all 0.2s;
      }

      .reset-btn:hover {
        background: rgba(239, 68, 68, 0.3);
        color: #fff;
      }

      .sidebar-tokens {
        flex: 1;
        display: flex;
        flex-wrap: wrap;
        align-content: flex-start;
        gap: 8px;
        overflow-y: auto;
        padding-top: 6px;
      }

      .sidebar-token {
        border-radius: 10px;
        padding: 8px 14px;
        min-height: 44px;
        font-size: 14px;
        cursor: grab;
        border: 1px dashed rgba(255, 255, 255, 0.25);
        background: rgba(255, 255, 255, 0.05);
        color: #cbd5e1;
        transition: all 0.2s ease;
      }

      .sidebar-token:hover {
        background: rgba(255, 255, 255, 0.12);
        border-color: rgba(255, 255, 255, 0.5);
      }

      /* فضای مختصات */
      .canvas-space {
        flex: 1;
        position: relative;
        background-color: #0b0f19;
        background-image:
          radial-gradient(rgba(255, 255, 255, 0.08) 1.5px, transparent 1.5px),
          linear-gradient(
            to right,
            rgba(255, 255, 255, 0.03) 1px,
            transparent 1px
          ),
          linear-gradient(
            to bottom,
            rgba(255, 255, 255, 0.03) 1px,
            transparent 1px
          );
        background-size:
          30px 30px,
          120px 120px,
          120px 120px;
        overflow: hidden;
      }

      .top-controls {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 12px;
        z-index: 100;
      }

      .action-btn {
        background: #4f46e5;
        color: #fff;
        border: none;
        padding: 10px 22px;
        border-radius: 12px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(79, 70, 229, 0.4);
        transition: all 0.2s ease;
        display: none;
      }

      .action-btn:hover {
        background: #6366f1;
        transform: translateY(-2px);
      }

      /* استایل کلمات */
      .token {
        position: absolute;
        padding: 8px 18px;
        min-height: 44px;
        border-radius: 12px;
        font-size: 15px;
        font-weight: 500;
        cursor: grab;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        border: 1.5px solid rgba(255, 255, 255, 0.15);
        background: rgba(255, 255, 255, 0.06);
        color: #e2e8f0;
        transition:
          background-color 0.3s ease,
          border-color 0.3s ease,
          color 0.3s ease,
          box-shadow 0.3s ease,
          transform 0.1s ease;
        touch-action: none;
      }

      .token:active:not(.locked) {
        cursor: grabbing;
        transform: scale(1.05);
        z-index: 1000 !important;
      }

      /* حالت فیکس شده و غیرقابل جابه‌جایی */
      .token.locked {
        cursor: default !important;
        opacity: 0.95;
      }

      .token.pivot {
        border: 2px dashed #f8fafc;
        background: #1e293b;
        color: #ffffff;
        font-size: 16px;
        font-weight: 700;
        box-shadow: 0 0 25px rgba(255, 255, 255, 0.35);
        z-index: 100;
      }
      button:focus-visible,
      .sidebar-token:focus-visible,
      .token:focus-visible {
        outline: 3px solid #fbbf24;
        outline-offset: 3px;
      }
      @media (max-width: 700px) {
        body {
          flex-direction: column;
        }
        .canvas-space {
          order: 1;
          width: 100%;
          min-height: 0;
        }
        .sidebar {
          order: 2;
          width: 100%;
          height: min(42dvh, 320px);
          flex: 0 0 auto;
          padding: 12px;
          gap: 8px;
          border-top: 1px solid rgba(255, 255, 255, 0.1);
          border-left: 0;
          box-shadow: 0 -5px 25px rgba(0, 0, 0, 0.45);
        }
        .sidebar-desc {
          font-size: 12px;
          line-height: 1.55;
        }
        .sidebar-tokens {
          padding-top: 2px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
    <link rel="stylesheet" href="../shared/ui/word-labs.css" />
  </head>
  <body class="mg-word-lab">
    <div class="sidebar" id="sidebar">
      <div class="level-info" id="levelInfo">خوشه‌بندی معنایی کلمات</div>

      <div class="sidebar-desc" id="sidebarDesc">
        کلمه‌های هم‌معنی یا مرتبط رو بکش داخل صفحه و اون‌هایی که فکر می‌کنی به
        هم نزدیکن رو کنار هم بچین. برای حذف هر کلمه، کافیه اون رو برگردونی سمت
        همین نوار.
      </div>

      <button class="reset-btn" id="resetBtn">پاک کردن کل صفحه</button>
      <div class="sidebar-tokens" id="sidebarList"></div>
    </div>

    <div class="canvas-space" id="canvasSpace">
      <div class="top-controls">
        <button class="action-btn" id="revealBtn">
          چیدمان نهایی و بررسی رنگ‌ها
        </button>
        <button class="action-btn" id="addPivotBtn"></button>
      </div>
    </div>

    <script>
      const stages = [
        {
          pivotWord: 'شیر',
          clusters: [
            {
              name: 'حیوان',
              color: '#fbbf24',
              bg: 'rgba(245, 158, 11, 0.25)',
              border: 'rgba(245, 158, 11, 0.8)',
              words: ['جنگل', 'پلنگ', 'ببر', 'گربه', 'شکار'],
            },
            {
              name: 'آب',
              color: '#38bdf8',
              bg: 'rgba(6, 182, 212, 0.25)',
              border: 'rgba(6, 182, 212, 0.8)',
              words: ['آب', 'شلنگ', 'لوله', 'سینک'],
            },
            {
              name: 'نوشیدنی',
              color: '#f472b6',
              bg: 'rgba(236, 72, 153, 0.25)',
              border: 'rgba(236, 72, 153, 0.8)',
              words: ['لبنیات', 'ماست', 'پنیر', 'صبحانه'],
            },
          ],
        },
      ];

      let isColorsRevealed = false;
      let pivotAdded = false;

      const sidebar = document.getElementById('sidebar');
      const sidebarList = document.getElementById('sidebarList');
      const canvasSpace = document.getElementById('canvasSpace');
      const levelInfo = document.getElementById('levelInfo');
      const sidebarDesc = document.getElementById('sidebarDesc');
      const revealBtn = document.getElementById('revealBtn');
      const addPivotBtn = document.getElementById('addPivotBtn');
      const resetBtn = document.getElementById('resetBtn');

      function loadStage() {
        levelInfo.innerText = 'خوشه‌بندی معنایی کلمات';
        addPivotBtn.innerText = `اضافه کردن " ${stages[0].pivotWord} "`;
        sidebarDesc.innerText =
          'کلمه‌های هم‌معنی یا مرتبط رو بکش داخل صفحه و اون‌هایی که فکر می‌کنی به هم نزدیکن رو کنار هم بچین. برای حذف هر کلمه، کافیه اون رو برگردونی سمت همین نوار.';

        // پاک کردن صفحه و سایدبار
        canvasSpace.querySelectorAll('.token').forEach((t) => t.remove());
        sidebarList.innerHTML = '';

        isColorsRevealed = false;
        pivotAdded = false;

        revealBtn.style.display = 'none';
        addPivotBtn.style.display = 'none';

        const allWords = [];
        stages[0].clusters.forEach((cluster) => {
          cluster.words.forEach((word) => {
            allWords.push({ text: word, cluster });
          });
        });
        allWords.sort(() => Math.random() - 0.5);

        allWords.forEach((item) => {
          addWordToSidebar(item.text, item.cluster);
        });
      }

      function addWordToSidebar(word, clusterData) {
        const el = document.createElement('div');
        el.className = 'sidebar-token';
        el.innerText = word;
        el.tabIndex = 0;
        el.setAttribute('role', 'button');
        el.setAttribute('aria-label', `${word}؛ برای قرار دادن Enter بزن`);
        el.dataset.clusterName = clusterData.name;
        el.dataset.clusterColor = clusterData.color;
        el.dataset.clusterBg = clusterData.bg;
        el.dataset.clusterBorder = clusterData.border;
        initSidebarDrag(el);
        sidebarList.appendChild(el);
      }

      function updateControlsVisibility() {
        const remainingSidebar =
          sidebarList.querySelectorAll('.sidebar-token').length;
        const placedTokens = canvasSpace.querySelectorAll('.token:not(.pivot)');
        if (
          remainingSidebar === 0 &&
          placedTokens.length > 0 &&
          !isColorsRevealed
        ) {
          revealBtn.style.display = 'inline-block';
        } else if (!isColorsRevealed) {
          revealBtn.style.display = 'none';
        }
      }

      function initSidebarDrag(el) {
        el.addEventListener('pointerdown', (e) => {
          if (e.button !== 0) return;
          e.preventDefault();
          el.setPointerCapture(e.pointerId);

          const clone = el.cloneNode(true);
          clone.classList.remove('sidebar-token');
          clone.classList.add('token');
          clone.style.position = 'fixed';
          clone.style.zIndex = '2000';
          clone.style.pointerEvents = 'none';
          clone.style.transform = 'translate(-50%, -50%) scale(1.05)';
          document.body.appendChild(clone);

          const moveAt = (x, y) => {
            clone.style.left = `${x}px`;
            clone.style.top = `${y}px`;
          };
          moveAt(e.clientX, e.clientY);

          const onPointerMove = (evt) => moveAt(evt.clientX, evt.clientY);

          const finish = (evt, dropped) => {
            el.removeEventListener('pointermove', onPointerMove);
            el.removeEventListener('pointerup', onPointerUp);
            el.removeEventListener('pointercancel', onPointerCancel);

            const canvasRect = canvasSpace.getBoundingClientRect();
            if (
              dropped &&
              evt.clientX >= canvasRect.left &&
              evt.clientX <= canvasRect.right &&
              evt.clientY >= canvasRect.top &&
              evt.clientY <= canvasRect.bottom
            ) {
              const dropX = evt.clientX - canvasRect.left - 40;
              const dropY = evt.clientY - canvasRect.top - 20;

              createCanvasToken(
                el.innerText,
                dropX,
                dropY,
                {
                  name: el.dataset.clusterName,
                  color: el.dataset.clusterColor,
                  bg: el.dataset.clusterBg,
                  border: el.dataset.clusterBorder,
                },
                false
              );

              el.remove();
              updateControlsVisibility();
            }
            clone.remove();
          };

          const onPointerUp = (evt) => finish(evt, true);
          const onPointerCancel = (evt) => finish(evt, false);
          el.addEventListener('pointermove', onPointerMove);
          el.addEventListener('pointerup', onPointerUp);
          el.addEventListener('pointercancel', onPointerCancel);
        });
        el.addEventListener('keydown', (event) => {
          if (!['Enter', ' '].includes(event.key)) return;
          event.preventDefault();
          createCanvasToken(
            el.innerText,
            canvasSpace.clientWidth / 2,
            canvasSpace.clientHeight / 2,
            {
              name: el.dataset.clusterName,
              color: el.dataset.clusterColor,
              bg: el.dataset.clusterBg,
              border: el.dataset.clusterBorder,
            }
          );
          el.remove();
          updateControlsVisibility();
        });
      }

      function createCanvasToken(text, x, y, clusterData, isPivot = false) {
        const el = document.createElement('div');
        el.className = `token ${isPivot ? 'pivot' : ''}`;
        el.innerText = text;
        el.tabIndex = 0;
        el.setAttribute('role', 'button');
        el.setAttribute('aria-label', `${text}؛ با کلیدهای جهت جابه‌جا کن`);
        el.style.left = `${Math.max(10, x)}px`;
        el.style.top = `${Math.max(10, y)}px`;

        if (clusterData) {
          el.dataset.clusterName = clusterData.name;
          el.dataset.clusterColor = clusterData.color;
          el.dataset.clusterBg = clusterData.bg;
          el.dataset.clusterBorder = clusterData.border;
        }

        if (isPivot) {
          el.id = 'pivotElement';
        } else if (isColorsRevealed) {
          el.style.backgroundColor = clusterData.bg;
          el.style.borderColor = clusterData.border;
          el.style.color = clusterData.color;
        }

        canvasSpace.appendChild(el);
        makeTokenDraggable(el, isPivot);

        if (isPivot) updatePivotColor(el);
        return el;
      }

      function makeTokenDraggable(el, isPivot) {
        let isDragging = false;
        let startX, startY, initLeft, initTop;

        const onPointerDown = (e) => {
          if (e.button !== 0) return;
          // کلمات فیکس‌شده قابلیت درگ ندارند
          if (el.classList.contains('locked')) return;

          isDragging = true;
          e.preventDefault();
          el.setPointerCapture(e.pointerId);
          startX = e.clientX;
          startY = e.clientY;
          initLeft = el.offsetLeft;
          initTop = el.offsetTop;

          el.addEventListener('pointermove', onPointerMove);
          el.addEventListener('pointerup', onPointerUp);
          el.addEventListener('pointercancel', onPointerCancel);
        };

        const onPointerMove = (e) => {
          if (!isDragging) return;
          const dx = e.clientX - startX;
          const dy = e.clientY - startY;

          el.style.left = `${initLeft + dx}px`;
          el.style.top = `${initTop + dy}px`;

          const pivot = document.getElementById('pivotElement');
          if (pivot) updatePivotColor(pivot);
        };

        const finishPointer = (e, cancelled) => {
          if (!isDragging) return;
          isDragging = false;
          el.removeEventListener('pointermove', onPointerMove);
          el.removeEventListener('pointerup', onPointerUp);
          el.removeEventListener('pointercancel', onPointerCancel);
          if (cancelled) {
            el.style.left = `${initLeft}px`;
            el.style.top = `${initTop}px`;
            return;
          }

          const sidebarRect = sidebar.getBoundingClientRect();
          // بازگشت کلمه به نوار کناری در صورت رها شدن در سایدبار
          if (e.clientX >= sidebarRect.left && e.clientX <= sidebarRect.right) {
            if (isPivot) {
              el.style.left = `${initLeft}px`;
              el.style.top = `${initTop}px`;
              return;
            }
            addWordToSidebar(el.innerText, {
              name: el.dataset.clusterName,
              color: el.dataset.clusterColor,
              bg: el.dataset.clusterBg,
              border: el.dataset.clusterBorder,
            });
            el.remove();
            updateControlsVisibility();
            return;
          }

          const spaceW = canvasSpace.clientWidth;
          const spaceH = canvasSpace.clientHeight;
          const boundedLeft = Math.max(
            10,
            Math.min(spaceW - el.offsetWidth - 10, el.offsetLeft)
          );
          const boundedTop = Math.max(
            70,
            Math.min(spaceH - el.offsetHeight - 10, el.offsetTop)
          );

          el.style.left = `${boundedLeft}px`;
          el.style.top = `${boundedTop}px`;

          const pivot = document.getElementById('pivotElement');
          if (pivot) updatePivotColor(pivot);
        };

        const onPointerUp = (e) => finishPointer(e, false);
        const onPointerCancel = (e) => finishPointer(e, true);
        el.addEventListener('pointerdown', onPointerDown);
        el.addEventListener('keydown', (event) => {
          if (event.key === 'Delete' || event.key === 'Backspace') {
            if (!isPivot) {
              addWordToSidebar(el.innerText, {
                name: el.dataset.clusterName,
                color: el.dataset.clusterColor,
                bg: el.dataset.clusterBg,
                border: el.dataset.clusterBorder,
              });
              el.remove();
              updateControlsVisibility();
            }
            return;
          }
          const step = event.shiftKey ? 24 : 8;
          const moves = {
            ArrowLeft: [-step, 0],
            ArrowRight: [step, 0],
            ArrowUp: [0, -step],
            ArrowDown: [0, step],
          };
          const move = moves[event.key];
          if (!move) return;
          event.preventDefault();
          el.style.left = `${el.offsetLeft + move[0]}px`;
          el.style.top = `${el.offsetTop + move[1]}px`;
          const pivot = document.getElementById('pivotElement');
          if (pivot) updatePivotColor(pivot);
        });
      }

      function updatePivotColor(pivotEl) {
        const pRect = pivotEl.getBoundingClientRect();
        const pCenterX = pRect.left + pRect.width / 2;
        const pCenterY = pRect.top + pRect.height / 2;

        const tokens = canvasSpace.querySelectorAll('.token:not(.pivot)');
        let closestCluster = null;
        let minDistance = Infinity;

        tokens.forEach((tok) => {
          const r = tok.getBoundingClientRect();
          const dist = Math.hypot(
            pCenterX - (r.left + r.width / 2),
            pCenterY - (r.top + r.height / 2)
          );
          if (dist < minDistance) {
            minDistance = dist;
            closestCluster = {
              name: tok.dataset.clusterName,
              color: tok.dataset.clusterColor,
              bg: tok.dataset.clusterBg,
              border: tok.dataset.clusterBorder,
            };
          }
        });

        if (closestCluster && minDistance < 180) {
          pivotEl.style.backgroundColor = closestCluster.bg.replace(
            '0.25',
            '0.45'
          );
          pivotEl.style.borderColor = closestCluster.color;
          pivotEl.style.color = closestCluster.color;
          pivotEl.style.boxShadow = `0 0 30px ${closestCluster.border}`;
        } else {
          pivotEl.style.backgroundColor = '#1e293b';
          pivotEl.style.borderColor = '#f8fafc';
          pivotEl.style.color = '#ffffff';
          pivotEl.style.boxShadow = '0 0 25px rgba(255, 255, 255, 0.35)';
        }
      }

      // ۱. چیدمان نهایی: رنگ‌ها مشخص شده و کلمات فیکس می‌شوند
      revealBtn.addEventListener('click', () => {
        isColorsRevealed = true;
        revealBtn.style.display = 'none';

        const tokens = canvasSpace.querySelectorAll('.token:not(.pivot)');
        tokens.forEach((tok) => {
          tok.style.backgroundColor = tok.dataset.clusterBg;
          tok.style.borderColor = tok.dataset.clusterBorder;
          tok.style.color = tok.dataset.clusterColor;
          // فیکس شدن موقعیت کلمه
          tok.classList.add('locked');
        });

        if (!pivotAdded) {
          addPivotBtn.style.display = 'inline-block';
        }
        sidebarDesc.innerText =
          'حالا دکمه «اضافه کردن شیر» رو بزن تا کلمه چندمعنایی به صفحه بیاد.';
      });

      // ۲. اضافه کردن کلمه چندمعنایی
      addPivotBtn.addEventListener('click', () => {
        pivotAdded = true;
        addPivotBtn.style.display = 'none';

        const spaceW = canvasSpace.clientWidth;
        const spaceH = canvasSpace.clientHeight;
        createCanvasToken(
          stages[0].pivotWord,
          spaceW / 2 - 40,
          spaceH / 2 - 20,
          null,
          true
        );

        sidebarDesc.innerText =
          'کلمه «شیر» رو بکش و به خوشه‌های مختلف نزدیک کن تا ببینی چطور معنا و تعبیه اون با تغییر بافت کلمات تغییر می‌کنه!';
      });

      // ۳. دکمه پاک کردن کل صفحه
      resetBtn.addEventListener('click', () => {
        loadStage();
      });

      // بارگذاری آغازین
      loadStage();
    </script>
  </body>
</html>
