<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>رمزگشا چگونه واژهٔ بعد را پیش‌بینی می‌کند</title>
  <link rel="stylesheet" href="transformer-viz.css" />
  <script src="transformer-viz.js" defer></script>
</head>
<body data-mode="decoder" data-language="fa">
  <main class="shell">
    <header class="masthead">
      <div>
        <div class="eyebrow">درون ترنسفورمر · رمزگشا</div>
        <h1>از بافت تا واژهٔ بعد.</h1>
      </div>
      <div class="header-actions">
        <nav class="mode-switch" aria-label="نوع نمایش">
          <a class="mode-link" href="encoder-fa.html">رمزگذار</a>
          <a class="mode-link active" href="decoder-fa.html" aria-current="page">رمزگشا</a>
          <a class="mode-link language-link" href="decoder.html" lang="en" dir="ltr">EN</a>
        </nav>
        <div class="controls">
          <button id="playBtn" type="button">▶ پخش</button>
          <button id="prevBtn" type="button">→ قبلی</button>
          <button id="stepBtn" type="button">بعدی ←</button>
          <button id="resetBtn" type="button">از نو</button>
        </div>
      </div>
    </header>

    <section class="sentence-board" aria-label="بیت تولیدشده">
      <span class="sentence-label">بیت تولیدشده</span>
      <div id="tokenStrip" class="token-strip"></div>
    </section>

    <section class="stage">
      <svg id="space" viewBox="0 0 900 470" role="img" aria-label="حرکت بازنمایی واژه‌های شعر در بافت به‌سوی واژهٔ پیش‌بینی‌شده">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto">
            <path d="M0 0L10 5L0 10Z" fill="var(--muted)" />
          </marker>
        </defs>
        <rect class="stage-bg" x="1" y="1" width="898" height="468" rx="14" />
        <g id="positionLayer"></g>
        <g id="vocabLayer"></g>
        <g id="activeLayer"></g>
      </svg>
    </section>

    <footer class="timeline">
      <div class="meta">
        <span id="stepLabel" class="badge"></span>
        <span id="counter" class="counter"></span>
      </div>
      <div class="progress-track"><div id="progress" class="progress-fill"></div></div>
    </footer>
  </main>
</body>
</html>
