<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8fc" />
    <title>واژه‌چین — کلمات در فضا</title>
    <link rel="stylesheet" href="style.css?v=mobile-zoom-3" />
  </head>
  <body>
    <main class="workspace">
      <aside class="sidebar" aria-label="فهرست واژه‌ها">
        <button id="reset" class="reset-button" type="button"><span aria-hidden="true">↺</span> شروع دوباره</button>
        <div id="word-list"></div>
      </aside>

      <section class="board-section" aria-label="صفحهٔ چیدمان">
        <div id="board" class="board fine-grid" tabindex="0" aria-label="صفحهٔ شطرنجی بدون مبدأ. یک واژه انتخاب کن و روی صفحه کلیک کن."></div>
      </section>
    </main>
    <div id="announcement" class="sr-only" role="status" aria-live="polite"></div>
    <script src="app.js?v=mobile-zoom-3"></script>
  </body>
</html>
