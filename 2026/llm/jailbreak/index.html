<!doctype html>

<html lang="fa" dir="rtl">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        نگهبان | Jailbreak Challenge
    </title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }


        body {

            font-family:
                Tahoma,
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at top right,
                    #edf4ff,
                    transparent 35%
                ),

                radial-gradient(
                    circle at bottom left,
                    #fff0eb,
                    transparent 30%
                ),

                #dce5f0;

            color: #182235;

            display: flex;

            align-items: center;
            justify-content: center;

            padding: 18px;
        }


        /* =========================
           APP
        ========================= */

        .app {

            width: min(950px, 100%);

            height: min(900px, 95vh);

            background: #f8fafc;

            border-radius: 26px;

            overflow: hidden;

            display: flex;

            flex-direction: column;

            box-shadow:
                0 30px 80px
                rgba(30, 48, 80, 0.18);
        }


        /* =========================
           HEADER
        ========================= */

        header {

            min-height: 74px;

            padding: 0 22px;

            display: flex;

            align-items: center;

            gap: 13px;

            border-bottom:
                1px solid #e1e6ee;
        }


        .avatar {

            width: 43px;
            height: 43px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 14px;

            color: white;

            background: #182235;

            font-size: 20px;
        }


        .identity {

            flex: 1;

            min-width: 0;
        }


        .title {

            font-size: 18px;

            font-weight: 700;

            margin-bottom: 4px;
        }


        .subtitle {

            color: #7b8799;

            font-size: 11px;
        }


        .status {

            display: flex;

            align-items: center;

            gap: 7px;

            color: #6d7788;

            font-size: 11px;
        }


        .status-dot {

            width: 8px;
            height: 8px;

            border-radius: 50%;

            background: #4cab83;
        }


        .status-dot.thinking {

            background: #f59e0b;
        }


        .status-dot.solved {

            background: #059669;
        }


        /* =========================
           LEVELS
        ========================= */

        .levels {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 8px;

            padding: 10px 16px;

            border-bottom:
                1px solid #e1e6ee;
        }


        .level-button {

            min-height: 41px;

            border: 0;

            border-radius: 12px;

            background: #e9edf3;

            color: #69758a;

            font-family: inherit;

            cursor: pointer;

            transition: 0.2s;
        }


        .level-button:hover:not(:disabled) {

            background: #dce3ec;

            color: #182235;
        }


        .level-button.active {

            color: white;

            background: #315be8;

            box-shadow:
                0 5px 15px
                rgba(49,91,232,0.2);
        }


        .level-button.solved {

            background: #dcfce7;

            color: #067857;
        }


        .level-button.active.solved {

            background: #059669;

            color: white;
        }


        .level-button:disabled {

            cursor: not-allowed;

            opacity: 0.45;
        }


        /* =========================
           MISSION
        ========================= */

        .mission {

            min-height: 45px;

            padding: 0 17px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            border-bottom:
                1px solid #e1e6ee;

            color: #748096;

            font-size: 11px;
        }


        .mission-text {

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;
        }


        .mission-status {

            flex-shrink: 0;
        }


        .mission-status.solved {

            color: #059669;

            font-weight: 700;
        }


        /* =========================
           CHAT
        ========================= */

        .messages {

            flex: 1;

            min-height: 0;

            overflow-y: auto;

            padding: 27px 24px;

            display: flex;

            flex-direction: column;
        }


        .messages::-webkit-scrollbar {

            width: 6px;
        }


        .messages::-webkit-scrollbar-thumb {

            background: #ccd4df;

            border-radius: 50px;
        }


        .empty {

            flex: 1;

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;
        }


        .empty-inner {

            max-width: 460px;
        }


        .empty-icon {

            width: 65px;
            height: 65px;

            margin: 0 auto 17px;

            border-radius: 20px;

            display: flex;

            align-items: center;
            justify-content: center;

            background: #eef3fb;

            font-size: 30px;
        }


        .empty h2 {

            margin:
                0 0 8px;

            font-size: 22px;
        }


        .empty p {

            margin: 0;

            color: #748096;

            font-size: 13px;

            line-height: 1.9;
        }


        /* =========================
           MESSAGE
        ========================= */

        .message {

            max-width: min(76%, 650px);

            margin-bottom: 14px;

            padding: 12px 16px;

            border-radius: 18px;

            font-size: 15px;

            line-height: 1.85;

            white-space: pre-wrap;

            overflow-wrap: anywhere;

            animation:
                appear 0.18s ease;
        }


        @keyframes appear {

            from {

                opacity: 0;

                transform:
                    translateY(5px);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }
        }


        .message.user {

            align-self: flex-start;

            color: white;

            background: #315be8;

            border-bottom-left-radius: 5px;
        }


        .message.assistant {

            align-self: flex-end;

            color: #1c2738;

            background: #e9edf3;

            border-bottom-right-radius: 5px;
        }


        /* =========================
           TYPING
        ========================= */

        .typing {

            display: none;

            align-self: flex-end;

            margin-bottom: 14px;

            padding:
                12px 16px;

            background: #e9edf3;

            border-radius: 17px;

            border-bottom-right-radius: 5px;
        }


        .dots {

            display: flex;

            gap: 5px;
        }


        .dots span {

            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #7f8da2;

            animation:
                typing 1s infinite;
        }


        .dots span:nth-child(2) {

            animation-delay:
                0.15s;
        }


        .dots span:nth-child(3) {

            animation-delay:
                0.30s;
        }


        @keyframes typing {

            0%,
            70%,
            100% {

                opacity: 0.25;

                transform:
                    translateY(0);
            }

            35% {

                opacity: 1;

                transform:
                    translateY(-3px);
            }
        }


        /* =========================
           SOLVED
        ========================= */

        .solved-box {

            display: none;

            margin:
                0 16px 14px;

            padding:
                16px 18px;

            border:
                1px solid #a7f3d0;

            border-radius: 16px;

            background:
                #ecfdf5;

            color: #065f46;

            align-items: center;

            justify-content: space-between;

            gap: 15px;
        }


        .solved-box.show {

            display: flex;
        }


        .solved-title {

            font-size: 15px;

            font-weight: 700;

            margin-bottom: 3px;
        }


        .solved-description {

            font-size: 11px;

            color: #047857;
        }


        .next-button {

            border: 0;

            border-radius: 10px;

            padding:
                9px 14px;

            background:
                #059669;

            color: white;

            font-family: inherit;

            cursor: pointer;

            white-space: nowrap;
        }


        .next-button:hover {

            background:
                #047857;
        }


        /* =========================
           INPUT
        ========================= */

        .composer {

            padding:
                14px 16px 17px;

            border-top:
                1px solid #e1e6ee;

            background:
                #f8fafc;
        }


        form {

            display: flex;

            align-items: flex-end;

            gap: 9px;

            padding:
                7px 7px 7px 15px;

            background: white;

            border:
                1px solid #d8dee8;

            border-radius: 17px;
        }


        form:focus-within {

            border-color:
                rgba(49,91,232,0.5);

            box-shadow:
                0 0 0 4px
                rgba(49,91,232,0.08);
        }


        textarea {

            flex: 1;

            width: 100%;

            min-height: 40px;

            max-height: 125px;

            resize: none;

            overflow-y: auto;

            border: 0;

            outline: 0;

            background: transparent;

            color: #182235;

            font-family: inherit;

            font-size: 14px;

            line-height: 1.5;

            padding:
                10px 0 8px;
        }


        textarea::placeholder {

            color: #9ba5b5;
        }


        .send-button {

            width: 42px;
            height: 42px;

            border: 0;

            border-radius: 13px;

            background:
                #182235;

            color: white;

            font-size: 17px;

            cursor: pointer;
        }


        .send-button:hover:not(:disabled) {

            background:
                #315be8;
        }


        .send-button:disabled {

            opacity: 0.35;

            cursor:
                not-allowed;
        }


        .hint {

            margin-top: 7px;

            text-align: center;

            font-size: 10px;

            color: #9aa4b4;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 650px) {

            body {

                padding: 0;
            }


            .app {

                width: 100%;

                height: 100%;

                border-radius: 0;
            }


            header {

                padding: 0 15px;
            }


            .levels {

                padding:
                    8px 10px;
            }


            .level-button {

                font-size: 11px;
            }


            .mission {

                padding:
                    0 12px;
            }


            .messages {

                padding:
                    22px 14px;
            }


            .message {

                max-width:
                    88%;

                font-size:
                    14px;
            }


            .solved-box {

                flex-direction:
                    column;

                align-items:
                    stretch;
            }


            .next-button {

                width: 100%;
            }


            .composer {

                padding:
                    11px;
            }

        }

    </style>

</head>


<body>

</div>

    // =====================================================
    // وضعیت بازی
    // =====================================================

    const state = {

        currentLevel:
            1,

        levels: {

            1: {
                messages: [],
                attempts: 0,
                solved: false
            },

            2: {
                messages: [],
                attempts: 0,
                solved: false
            },

            3: {
                messages: [],
                attempts: 0,
                solved: false
            }

        }

    };


    // =====================================================
    // عناصر صفحه
    // =====================================================

    const messagesElement =
        document.getElementById("messages");

    const emptyElement =
        document.getElementById("empty");

    const typingElement =
        document.getElementById("typing");

    const promptElement =
        document.getElementById("prompt");

    const sendButton =
        document.getElementById("sendButton");

    const composer =
        document.getElementById("composer");

    const titleElement =
        document.getElementById("levelTitle");

    const missionText =
        document.getElementById("missionText");

    const missionStatus =
        document.getElementById("missionStatus");

    const statusDot =
        document.getElementById("statusDot");

    const statusText =
        document.getElementById("statusText");

    const solvedBox =
        document.getElementById("solvedBox");

    const solvedDescription =
        document.getElementById("solvedDescription");

    const nextButton =
        document.getElementById("nextButton");

    const levelButtons =
        document.querySelectorAll(".level-button");


    // =====================================================
    // ابزارهای UI
    // =====================================================

    function scrollDown() {

        messagesElement.scrollTop =
            messagesElement.scrollHeight;

    }


    function updateEmpty() {

        const hasMessages =
            messagesElement.querySelector(
                ".message"
            );


        emptyElement.style.display =
            hasMessages
                ? "none"
                : "flex";

    }


    function clearMessages() {

        messagesElement
            .querySelectorAll(
                ".message"
            )
            .forEach(
                element =>
                    element.remove()
            );

    }


    function addMessage(
        role,
        text
    ) {

        const element =
            document.createElement(
                "div"
            );


        element.className =
            "message " + role;


        element.textContent =
            text;


        messagesElement.insertBefore(
            element,
            typingElement
        );


        updateEmpty();

        scrollDown();

    }


    function showTyping() {

        typingElement.style.display =
            "block";


        statusDot.className =
            "status-dot thinking";


        statusText.textContent =
            "نگهبان در حال فکر کردن...";


        scrollDown();

    }


    function hideTyping() {

        typingElement.style.display =
            "none";


        statusDot.className =
            "status-dot";


        statusText.textContent =
            "آماده";

    }


    // =====================================================
    // اطلاعات مرحله
    // =====================================================

    function updateLevelUI() {

        const levelNumber =
            state.currentLevel;


        const config =
            LEVELS[levelNumber];


        const levelState =
            state.levels[levelNumber];


        titleElement.textContent =
            config.name;


        missionText.textContent =
            config.description;


        if (
            levelState.solved
        ) {

            missionStatus.textContent =
                "✓ رمز فاش شد";


            missionStatus.className =
                "mission-status solved";


            statusDot.className =
                "status-dot solved";


            statusText.textContent =
                "مرحله حل شد";

        } else {

            missionStatus.textContent =
                "🔒 رمز محفوظ است";


            missionStatus.className =
                "mission-status";


            statusDot.className =
                "status-dot";


            statusText.textContent =
                "آماده";

        }


        levelButtons.forEach(
            button => {

                const number =
                    Number(
                        button.dataset.level
                    );


                button.classList.toggle(
                    "active",
                    number === levelNumber
                );


                button.classList.toggle(
                    "solved",
                    state.levels[number].solved
                );


                // مرحله بعد فقط وقتی باز میشود
                // که مرحله قبلی حل شده باشد

                if (
                    number === 1
                ) {

                    button.disabled =
                        false;

                } else {

                    button.disabled =
                        !state.levels[
                            number - 1
                        ].solved;

                }

            }
        );


        updateSolvedBox();

    }


    // =====================================================
    // نمایش تاریخچه
    // =====================================================

    function renderHistory() {

        clearMessages();


        const history =
            state.levels[
                state.currentLevel
            ].messages;


        history.forEach(
            message => {

                addMessage(
                    message.role,
                    message.text
                );

            }
        );


        updateEmpty();

        scrollDown();

    }


    // =====================================================
    // نتیجه مرحله
    // =====================================================

    function updateSolvedBox() {

        const levelState =
            state.levels[
                state.currentLevel
            ];


        if (
            !levelState.solved
        ) {

            solvedBox.classList.remove(
                "show"
            );

            return;

        }


        solvedBox.classList.add(
            "show"
        );


        if (
            state.currentLevel === 3
        ) {

            solvedDescription.textContent =
                "🏆 هر سه مرحله را کامل کردی.";

            nextButton.textContent =
                "شروع دوباره";

        } else {

            solvedDescription.textContent =
                "نگهبان رمز این مرحله را فاش کرد.";

            nextButton.textContent =
                "رفتن به مرحله بعد";

        }

    }


    // =====================================================
    // درخواست به Worker
    // =====================================================

    async function askGuard(
        levelNumber,
        signal
    ) {

        const config =
            LEVELS[levelNumber];


        const history =
            state.levels[
                levelNumber
            ].messages;


        const modelMessages = [

            {
                role:
                    "system",

                content:
                    config.prompt
            },

            ...history.map(
                message => ({

                    role:
                        message.role,

                    content:
                        message.text

                })
            )

        ];


        const response =
            await fetch(
                API_URL,
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            level:
                                levelNumber,

                            model:
                                config.model,

                            temperature:
                                config.temperature,

                            messages:
                                modelMessages

                        }),

                    signal:
                        signal

                }
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "Worker error"
            );

        }


        const data =
            await response.json();


        const answer =
            data.answer
            || data.text
            || data.choices?.[0]?.message?.content;


        if (
            !answer
        ) {

            throw new Error(
                "Empty answer"
            );

        }


        return String(
            answer
        );

    }


    // =====================================================
    // ارسال پیام
    // =====================================================

    async function sendMessage() {

        const text =
            promptElement.value.trim();


        if (
            !text
        ) {
            return;
        }


        const levelNumber =
            state.currentLevel;


        const levelState =
            state.levels[levelNumber];


        if (
            levelState.solved
        ) {
            return;
        }


        // ذخیره پیام کاربر

        levelState.attempts++;


        levelState.messages.push({

            role:
                "user",

            text:
                text

        });


        addMessage(
            "user",
            text
        );


        promptElement.value =
            "";


        resizeTextarea();


        sendButton.disabled =
            true;


        promptElement.disabled =
            true;


        showTyping();


        try {

            const controller =
                new AbortController();


            const answer =
                await askGuard(
                    levelNumber,
                    controller.signal
                );


            hideTyping();


            // ذخیره پاسخ

            levelState.messages.push({

                role:
                    "assistant",

                text:
                    answer

            });


            addMessage(
                "assistant",
                answer
            );


            // ================================
            // تشخیص موفقیت
            // ================================

            const secret =
                LEVELS[
                    levelNumber
                ].secret;


            if (
                answer
                    .toLowerCase()
                    .includes(
                        secret.toLowerCase()
                    )
            ) {

                levelState.solved =
                    true;


                updateLevelUI();

            }


        } catch (error) {

            hideTyping();


            console.error(
                error
            );


            addMessage(

                "assistant",

                "ارتباط با نگهبان با مشکل مواجه شد. دوباره امتحان کن."

            );

        }


        promptElement.disabled =
            false;


        sendButton.disabled =
            !promptElement.value.trim();


        promptElement.focus();

    }


    // =====================================================
    // مرحله بعد
    // =====================================================

    function goNextLevel() {

        if (
            state.currentLevel === 3
        ) {

            startNewGame();

            return;

        }


        const nextLevel =
            state.currentLevel + 1;


        if (
            !state.levels[
                state.currentLevel
            ].solved
        ) {

            return;

        }


        state.currentLevel =
            nextLevel;


        updateLevelUI();

        renderHistory();


        promptElement.disabled =
            false;


        promptElement.focus();

    }


    // =====================================================
    // بازی جدید
    // =====================================================

    function startNewGame() {

        for (
            let i = 1;
            i <= 3;
            i++
        ) {

            state.levels[i] = {

                messages: [],

                attempts: 0,

                solved: false

            };

        }


        state.currentLevel =
            1;


        updateLevelUI();

        renderHistory();


        promptElement.disabled =
            false;


        sendButton.disabled =
            true;


        promptElement.value =
            "";


        promptElement.focus();

    }


    // =====================================================
    // Textarea
    // =====================================================

    function resizeTextarea() {

        promptElement.style.height =
            "auto";


        promptElement.style.height =
            Math.min(
                promptElement.scrollHeight,
                125
            ) + "px";


        sendButton.disabled =
            !promptElement.value.trim();

    }


    // =====================================================
    // Events
    // =====================================================

    composer.addEventListener(
        "submit",
        function(event) {

            event.preventDefault();

            sendMessage();

        }
    );


    promptElement.addEventListener(
        "input",
        resizeTextarea
    );


    promptElement.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
                && !event.shiftKey
                && !event.isComposing
            ) {

                event.preventDefault();

                composer.requestSubmit();

            }

        }
    );


    levelButtons.forEach(
        button => {

            button.addEventListener(
                "click",
                function() {

                    const level =
                        Number(
                            button.dataset.level
                        );


                    if (
                        button.disabled
                    ) {

                        return;

                    }


                    state.currentLevel =
                        level;


                    updateLevelUI();

                    renderHistory();


                    promptElement.focus();

                }
            );

        }
    );


    nextButton.addEventListener(
        "click",
        goNextLevel
    );


    // =====================================================
    // شروع
    // =====================================================

    updateLevelUI();

    resizeTextarea();

    renderHistory();

    promptElement.focus();


</script>
