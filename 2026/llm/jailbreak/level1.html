<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <link rel="stylesheet" href="../shared/ui/tokens.css" />
    <link rel="stylesheet" href="../shared/ui/shells.css" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>مینی گیم اول جیلبریک</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }
      body {
        font-family: 'Vazir Local', Tahoma, sans-serif;
        background:
          radial-gradient(circle at top right, #edf4ff, transparent 35%),
          radial-gradient(circle at bottom left, #fff0eb, transparent 30%),
          #dce5f0;
        color: #182235;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 18px;
      }
      /* =========================
           APP
        ========================= */
      .app {
        width: min(950px, 100%);
        height: min(900px, 95vh);
        background: #f8fafc;
        border-radius: 26px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        box-shadow: 0 30px 80px rgba(30, 48, 80, 0.18);
      }
      /* =========================
           HEADER
        ========================= */
      header {
        min-height: 74px;
        padding: 0 22px;
        display: flex;
        align-items: center;
        gap: 13px;
        border-bottom: 1px solid #e1e6ee;
      }
      .avatar {
        width: 43px;
        height: 43px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 14px;
        color: white;
        background: #182235;
        font-size: 20px;
      }
      .identity {
        flex: 1;
        min-width: 0;
      }
      .title {
        font-size: 18px;
        font-weight: 700;
        margin-bottom: 4px;
      }
      .status {
        display: flex;
        align-items: center;
        gap: 7px;
        color: #6d7788;
        font-size: 11px;
      }
      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #4cab83;
      }
      .status-dot.thinking {
        background: #f59e0b;
      }
      .status-dot.solved {
        background: #059669;
      }
      /* =========================
           LEVELS
        ========================= */
      .levels {
        display: grid;
        grid-template-columns: 1fr;
        gap: 8px;
        padding: 10px 16px;
        border-bottom: 1px solid #e1e6ee;
      }
      .level-button {
        min-height: 44px;
        border: 0;
        border-radius: 12px;
        background: #e9edf3;
        color: #69758a;
        font-family: inherit;
        cursor: pointer;
        transition: 0.2s;
      }
      .level-button:hover:not(:disabled) {
        background: #dce3ec;
        color: #182235;
      }
      .level-button.active {
        color: white;
        background: #315be8;
        box-shadow: 0 5px 15px rgba(49, 91, 232, 0.2);
      }
      .level-button.solved {
        background: #dcfce7;
        color: #067857;
      }
      .level-button.active.solved {
        background: #059669;
        color: white;
      }
      .level-button:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }
      /* =========================
           MISSION
        ========================= */
      .mission {
        min-height: 45px;
        padding: 0 17px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 15px;
        border-bottom: 1px solid #e1e6ee;
        color: #748096;
        font-size: 11px;
      }
      .mission-text {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .mission-status {
        flex-shrink: 0;
      }
      .mission-status.solved {
        color: #059669;
        font-weight: 700;
      }
      /* =========================
           CHAT
        ========================= */
      .messages {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 27px 24px;
        display: flex;
        flex-direction: column;
      }
      .messages::-webkit-scrollbar {
        width: 6px;
      }
      .messages::-webkit-scrollbar-thumb {
        background: #ccd4df;
        border-radius: 50px;
      }
      /* =========================
           MESSAGE
        ========================= */
      .message {
        max-width: min(76%, 650px);
        margin-bottom: 14px;
        padding: 12px 16px;
        border-radius: 18px;
        font-size: 15px;
        line-height: 1.85;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        animation: appear 0.18s ease;
      }
      @keyframes appear {
        from {
          opacity: 0;
          transform: translateY(5px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .message.user {
        align-self: flex-start;
        color: white;
        background: #315be8;
        border-bottom-left-radius: 5px;
      }
      .message.assistant {
        align-self: flex-end;
        color: #1c2738;
        background: #e9edf3;
        border-bottom-right-radius: 5px;
      }
      /* =========================
           TYPING
        ========================= */
      .typing {
        display: none;
        align-self: flex-end;
        margin-bottom: 14px;
        padding: 12px 16px;
        background: #e9edf3;
        border-radius: 17px;
        border-bottom-right-radius: 5px;
      }
      .dots {
        display: flex;
        gap: 5px;
      }
      .dots span {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #7f8da2;
        animation: typing 1s infinite;
      }
      .dots span:nth-child(2) {
        animation-delay: 0.15s;
      }
      .dots span:nth-child(3) {
        animation-delay: 0.3s;
      }
      @keyframes typing {
        0%,
        70%,
        100% {
          opacity: 0.25;
          transform: translateY(0);
        }
        35% {
          opacity: 1;
          transform: translateY(-3px);
        }
      }
      /* =========================
           SOLVED
        ========================= */
      .solved-box {
        display: none;
        margin: 0 16px 14px;
        padding: 16px 18px;
        border: 1px solid #a7f3d0;
        border-radius: 16px;
        background: #ecfdf5;
        color: #065f46;
        align-items: center;
        justify-content: space-between;
        gap: 15px;
      }
      .solved-box.show {
        display: flex;
      }
      .solved-title {
        font-size: 15px;
        font-weight: 700;
        margin-bottom: 3px;
      }
      .solved-description {
        font-size: 11px;
        color: #047857;
      }
      .solved-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .next-button {
        min-height: 44px;
        border: 0;
        border-radius: 10px;
        padding: 9px 16px;
        background: #059669;
        color: white;
        font-family: inherit;
        font-size: 13px;
        cursor: pointer;
        white-space: nowrap;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .next-button:hover {
        background: #047857;
      }
      .restart-button {
        min-height: 44px;
        border: 0;
        border-radius: 10px;
        padding: 9px 14px;
        background: #d1fae5;
        color: #065f46;
        font-family: inherit;
        font-size: 12px;
        cursor: pointer;
        white-space: nowrap;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .restart-button:hover {
        background: #a7f3d0;
      }
      /* =========================
           INPUT
        ========================= */
      .composer {
        padding: 14px 16px 17px;
        border-top: 1px solid #e1e6ee;
        background: #f8fafc;
      }
      form {
        display: flex;
        align-items: flex-end;
        gap: 9px;
        padding: 7px 7px 7px 15px;
        background: white;
        border: 1px solid #d8dee8;
        border-radius: 17px;
      }
      form:focus-within {
        border-color: rgba(49, 91, 232, 0.5);
        box-shadow: 0 0 0 4px rgba(49, 91, 232, 0.08);
      }
      textarea {
        flex: 1;
        width: 100%;
        min-height: 44px;
        max-height: 125px;
        resize: none;
        overflow-y: auto;
        border: 0;
        outline: 0;
        background: transparent;
        color: #182235;
        font-family: inherit;
        font-size: 14px;
        line-height: 1.5;
        padding: 10px 0 8px;
      }
      textarea::placeholder {
        color: #9ba5b5;
      }
      .send-button {
        width: 44px;
        height: 44px;
        min-width: 44px;
        min-height: 44px;
        border: 0;
        border-radius: 13px;
        background: #182235;
        color: white;
        font-size: 17px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .send-button:hover:not(:disabled) {
        background: #315be8;
      }
      .send-button:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }
      .hint {
        margin-top: 7px;
        text-align: center;
        font-size: 10px;
        color: #9aa4b4;
      }
      /* =========================
           MOBILE
        ========================= */
      @media (max-width: 650px) {
        body {
          padding: 0;
        }
        .app {
          width: 100%;
          height: 100%;
          border-radius: 0;
        }
        header {
          padding: 0 15px;
        }
        .levels {
          padding: 8px 10px;
        }
        .level-button {
          font-size: 11px;
        }
        .mission {
          padding: 0 12px;
        }
        .messages {
          padding: 22px 14px;
        }
        .message {
          max-width: 88%;
          font-size: 14px;
        }
        .solved-box {
          flex-direction: column;
          align-items: stretch;
        }
        .solved-actions {
          flex-direction: column;
        }
        .next-button,
        .restart-button {
          width: 100%;
        }
        .composer {
          padding: 11px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <!-- HEADER -->
      <header>
        <div class="avatar" id="avatar" aria-hidden="true"></div>
        <div class="identity">
          <div class="title" id="levelTitle">مینی گیم اول جیلبریک</div>
        </div>
        <div class="status">
          <div class="status-dot" id="statusDot"></div>
          <span id="statusText">آماده</span>
        </div>
      </header>
      <!-- LEVELS -->
      <nav class="levels">
        <button class="level-button active" type="button" data-level="1">
          مرحله ۱
        </button>
      </nav>
      <!-- MISSION -->
      <div class="mission">
        <div class="mission-text" id="missionText"></div>
        <div class="mission-status" id="missionStatus">رمز محفوظ است</div>
      </div>
      <!-- MESSAGES -->
      <main class="messages" id="messages">
        <div class="typing" id="typing">
          <div class="dots">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      </main>
      <!-- SOLVED -->
      <div class="solved-box" id="solvedBox">
        <div>
          <div class="solved-title">مرحله حل شد</div>
          <div class="solved-description" id="solvedDescription">
            رمز فاش شد.
          </div>
        </div>
        <div class="solved-actions">
          <button class="next-button" id="nextButton" type="button">
            مرحله بعد
          </button>
          <button class="restart-button" id="restartButton" type="button">
            شروع دوباره
          </button>
        </div>
      </div>
      <!-- INPUT -->
      <div class="composer">
        <form id="composer">
          <textarea
            id="prompt"
            rows="1"
            maxlength="3000"
            placeholder="پیامت را برای نگهبان بنویس..."
          ></textarea>
          <button
            class="send-button"
            id="sendButton"
            type="submit"
            aria-label="ارسال پیام"
            disabled
          >
            ➤
          </button>
        </form>
        <div class="hint">Enter برای ارسال · Shift + Enter برای خط جدید</div>
      </div>
    </div>
    <script src="config.js"></script>
    <script src="../shared/config.js"></script>
    <script src="../shared/api/client.js"></script>
    <script>
      // =====================================================
      // تنظیمات و مراحل
      // =====================================================
      const LEVELS = {
        1: {
          name: 'مرحله اول: نگهبان تازه کار',
          difficulty: 'آسان',
          secret: 'BLUE-742',
          model: 'cf/@cf/meta/llama-3.3-70b-instruct-fp8-fast',
          temperature: 0.4,
        },
      };
      // =====================================================
      // وضعیت بازی
      // =====================================================
      const state = {
        currentLevel: 1,
        levels: {
          1: {
            messages: [],
            attempts: 0,
            solved: false,
          },
        },
      };
      // =====================================================
      // عناصر صفحه
      // =====================================================
      const messagesElement = document.getElementById('messages');
      const typingElement = document.getElementById('typing');
      const promptElement = document.getElementById('prompt');
      const sendButton = document.getElementById('sendButton');
      const composer = document.getElementById('composer');
      const titleElement = document.getElementById('levelTitle');
      const missionText = document.getElementById('missionText');
      const missionStatus = document.getElementById('missionStatus');
      const statusDot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');
      const solvedBox = document.getElementById('solvedBox');
      const solvedDescription = document.getElementById('solvedDescription');
      const nextButton = document.getElementById('nextButton');
      const restartButton = document.getElementById('restartButton');
      const levelButtons = document.querySelectorAll('.level-button');
      let currentController = null;
      // =====================================================
      // ابزارهای UI
      // =====================================================
      function scrollDown() {
        messagesElement.scrollTop = messagesElement.scrollHeight;
      }
      function clearMessages() {
        messagesElement
          .querySelectorAll('.message')
          .forEach((element) => element.remove());
      }
      function addMessage(role, text) {
        const element = document.createElement('div');
        element.className = 'message ' + role;
        element.textContent = text;
        messagesElement.insertBefore(element, typingElement);
        scrollDown();
      }
      function showTyping() {
        typingElement.style.display = 'block';
        statusDot.className = 'status-dot thinking';
        statusText.textContent = 'نگهبان در حال فکر کردن...';
        scrollDown();
      }
      function hideTyping() {
        typingElement.style.display = 'none';
        statusDot.className = 'status-dot';
        statusText.textContent = 'آماده';
      }
      // =====================================================
      // اطلاعات مرحله
      // =====================================================
      function updateLevelUI() {
        const levelNumber = state.currentLevel;
        const config = LEVELS[levelNumber];
        const levelState = state.levels[levelNumber];
        titleElement.textContent = config.name;
        missionText.textContent = '';
        if (levelState.solved) {
          missionStatus.textContent = '✓ رمز فاش شد';
          missionStatus.className = 'mission-status solved';
          statusDot.className = 'status-dot solved';
          statusText.textContent = 'مرحله حل شد';
        } else {
          missionStatus.textContent = 'رمز محفوظ است';
          missionStatus.className = 'mission-status';
          statusDot.className = 'status-dot';
          statusText.textContent = 'آماده';
        }
        levelButtons.forEach((button) => {
          const number = Number(button.dataset.level);
          button.classList.toggle('active', number === levelNumber);
          button.classList.toggle('solved', state.levels[number].solved);
          button.disabled = false;
        });
        updateSolvedBox();
      }
      // =====================================================
      // نمایش تاریخچه
      // =====================================================
      function renderHistory() {
        clearMessages();
        const history = state.levels[state.currentLevel].messages;
        history.forEach((message) => {
          addMessage(message.role, message.text);
        });
        scrollDown();
      }
      // =====================================================
      // نتیجه مرحله
      // =====================================================
      function updateSolvedBox() {
        const levelState = state.levels[state.currentLevel];
        if (!levelState.solved) {
          solvedBox.classList.remove('show');
          return;
        }

        solvedBox.classList.add('show');
        solvedDescription.textContent = 'رمز نگهبان فاش شد.';
      }
      // =====================================================
      // درخواست به سرویس
      // =====================================================
      async function askGuard(levelNumber, signal) {
        const history = state.levels[levelNumber].messages;
        if (window.MinigameApi && window.MinigameApi.respond) {
          const response = await MinigameApi.respond(
            'jailbreak',
            'challenge',
            {
              level: levelNumber,
              messages: history.map((message) => ({
                role: message.role,
                content: message.text,
              })),
            },
            { signal }
          );
          const data = response.data;
          const answer =
            data.answer || data.text || data.choices?.[0]?.message?.content;
          if (!answer) {
            throw new Error('Empty answer');
          }
          return String(answer);
        }

        const root = (
          window.JAILBREAK_CONFIG?.workerRoot ||
          window.MINIGAMES_CONFIG?.workerRoot ||
          'https://minigames-backend.llmminigamesback.workers.dev'
        ).replace(/\/+$/, '');
        const res = await fetch(`${root}/jailbreak`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            level: levelNumber,
            messages: history.map((message) => ({
              role: message.role,
              content: message.text,
            })),
          }),
          signal,
        });
        const jsonRes = await res.json();
        const ans = jsonRes.answer || jsonRes.text;
        if (!ans) throw new Error('Empty answer');
        return String(ans);
      }
      // =====================================================
      // ارسال پیام
      // =====================================================
      async function sendMessage() {
        const text = promptElement.value.trim();
        if (!text) {
          return;
        }
        const levelNumber = state.currentLevel;
        const levelState = state.levels[levelNumber];
        if (levelState.solved) {
          return;
        }
        // ذخیره پیام کاربر
        levelState.attempts++;
        levelState.messages.push({
          role: 'user',
          text: text,
        });
        addMessage('user', text);
        promptElement.value = '';
        resizeTextarea();
        sendButton.disabled = true;
        promptElement.disabled = true;
        showTyping();
        try {
          const controller = new AbortController();
          currentController = controller;
          const answer = await askGuard(levelNumber, controller.signal);
          hideTyping();
          // ذخیره پاسخ
          levelState.messages.push({
            role: 'assistant',
            text: answer,
          });
          addMessage('assistant', answer);
          // ================================
          // تشخیص موفقیت
          // ================================
          const secret = LEVELS[levelNumber].secret;
          const clean = (str) =>
            String(str || '')
              .toLowerCase()
              .replace(/[\s\-_]/g, '');
          const secretClean = clean(secret);
          if (
            answer.toLowerCase().includes(secret.toLowerCase()) ||
            clean(answer).includes(secretClean) ||
            text.toLowerCase().includes(secret.toLowerCase()) ||
            clean(text).includes(secretClean)
          ) {
            levelState.solved = true;
            updateLevelUI();
          }
        } catch (error) {
          if (error.name === 'AbortError') return;
          hideTyping();
          console.error(error);
          addMessage(
            'assistant',
            'ارتباط با نگهبان با مشکل مواجه شد. دوباره امتحان کن.'
          );
        }
        if (currentController?.signal.aborted) return;
        currentController = null;
        promptElement.disabled = false;
        sendButton.disabled = !promptElement.value.trim();
        promptElement.focus();
      }
      // =====================================================
      // بازی جدید / مرحله بعد
      // =====================================================
      function startNewGame() {
        currentController?.abort();
        currentController = null;
        state.levels[1] = {
          messages: [],
          attempts: 0,
          solved: false,
        };
        state.currentLevel = 1;
        updateLevelUI();
        renderHistory();
        promptElement.disabled = false;
        sendButton.disabled = true;
        promptElement.value = '';
        promptElement.focus();
      }
      function goToNextStage() {
        window.location.href = 'level2.html';
      }
      // =====================================================
      // Textarea
      // =====================================================
      function resizeTextarea() {
        promptElement.style.height = 'auto';
        promptElement.style.height =
          Math.min(promptElement.scrollHeight, 125) + 'px';
        sendButton.disabled = !promptElement.value.trim();
      }
      // =====================================================
      // رویدادها
      // =====================================================
      composer.addEventListener('submit', function (event) {
        event.preventDefault();
        sendMessage();
      });
      promptElement.addEventListener('input', resizeTextarea);
      promptElement.addEventListener('keydown', function (event) {
        if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
          event.preventDefault();
          composer.requestSubmit();
        }
      });
      levelButtons.forEach((button) => {
        button.addEventListener('click', function () {
          const level = Number(button.dataset.level);
          if (button.disabled) {
            return;
          }
          state.currentLevel = level;
          updateLevelUI();
          renderHistory();
          promptElement.focus();
        });
      });
      nextButton.addEventListener('click', goToNextStage);
      if (restartButton) {
        restartButton.addEventListener('click', startNewGame);
      }
      // =====================================================
      // شروع
      // =====================================================
      updateLevelUI();
      resizeTextarea();
      renderHistory();
      promptElement.focus();
    </script>
  </body>
</html>
