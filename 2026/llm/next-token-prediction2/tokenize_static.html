<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>پیش‌بینی واژه بعدی</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #111315;
      --surface: #191c1f;
      --field: #121416;
      --border: #30353a;
      --text: #f1f3f5;
      --muted: #929aa3;
      --guess: #9cc7ff;
      --model: #e6b878;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 40px 20px;
      display: grid;
      place-items: start center;
      background: var(--background);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(100%, 620px);
      padding: 30px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      box-shadow: 0 18px 50px rgb(0 0 0 / 18%);
    }
    h1 { margin: 0 0 24px; font-size: 1.3rem; font-weight: 650; }
    h2 { margin: 0 0 14px; font-size: .9rem; font-weight: 600; color: var(--muted); }
    .presets { display: flex; gap: 7px; margin-bottom: 15px; }
    button, input, textarea { font: inherit; }
    .preset {
      padding: 7px 11px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }
    .preset[aria-pressed="true"] { border-color: var(--guess); color: var(--text); }
    textarea, input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--field);
      color: var(--text);
    }
    textarea { min-height: 66px; resize: none; line-height: 1.7; margin-bottom: 14px; }
    input { margin-bottom: 11px; }
    .primary, .secondary {
      width: 100%;
      padding: 11px;
      border-radius: 6px;
      cursor: pointer;
    }
    .primary { border: 0; background: var(--guess); color: #111315; font-weight: 650; }
    .secondary { margin-top: 9px; border: 1px solid var(--border); background: transparent; color: var(--muted); }
    button:disabled, input:disabled { opacity: .5; cursor: not-allowed; }
    #game { display: none; }
    .context {
      min-height: 64px;
      margin-bottom: 18px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--field);
      font-size: 1.06rem;
      line-height: 2;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .guess-word { color: var(--guess); font-weight: 650; }
    .model-word { color: var(--model); font-weight: 650; }
    .status { min-height: 1.5em; margin: 10px 0; text-align: center; color: var(--muted); font-size: .84rem; }
    .results { display: none; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border); }
    .word-row { margin-bottom: 12px; }
    .word-labels { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 5px; font-size: .92rem; }
    .track { height: 7px; overflow: hidden; border-radius: 2px; background: var(--border); }
    .fill { height: 100%; background: var(--guess); }
    .outcome { margin-top: 16px; color: var(--muted); font-size: .88rem; }
    .outcome strong { color: var(--text); }
    :focus-visible { outline: 2px solid var(--guess); outline-offset: 3px; }
    @media (max-width: 560px) { body { padding: 16px 10px; } main { padding: 22px 18px; } }
  </style>
</head>
<body>
  <main>
    <h1>پیش‌بینی واژه بعدی</h1>
    <section id="setup">
      <div class="presets" aria-label="انتخاب جمله">
        <button class="preset" type="button" data-scenario="triangle">ریاضی</button>
        <button class="preset" type="button" data-scenario="dragon">داستان</button>
      </div>
      <textarea id="prompt" readonly aria-label="متن شروع"></textarea>
      <button class="primary" id="start" type="button">شروع</button>
    </section>
    <section id="game">
      <div id="context" class="context"></div>
      <input id="guess" type="text" maxlength="40" autocomplete="off" spellcheck="false" placeholder="واژه بعدی را حدس بزنید" aria-label="واژه بعدی">
      <button class="primary" id="submit" type="button">ثبت حدس</button>
      <div id="status" class="status" role="status"></div>
      <button class="secondary" id="restart" type="button">شروع دوباره</button>
      <section id="results" class="results" aria-live="polite">
        <h2>احتمال واژه‌ها</h2>
        <div id="word-list"></div>
        <div id="outcome" class="outcome"></div>
      </section>
    </section>
  </main>
  <script src="word-tree.js"></script>
  <script>
    const data = window.NEXT_WORD_TREES;
    const scenarios = data.scenarios;
    const setup = document.getElementById('setup');
    const game = document.getElementById('game');
    const prompt = document.getElementById('prompt');
    const context = document.getElementById('context');
    const guess = document.getElementById('guess');
    const submit = document.getElementById('submit');
    const status = document.getElementById('status');
    const results = document.getElementById('results');
    const wordList = document.getElementById('word-list');
    const outcome = document.getElementById('outcome');
    const presetButtons = [...document.querySelectorAll('.preset')];
    let scenarioId = 'triangle';
    let node = null;
    let chunks = [];

    function selectScenario(id) {
      scenarioId = id;
      prompt.value = scenarios[id].seed;
      presetButtons.forEach(button => {
        button.setAttribute('aria-pressed', String(button.dataset.scenario === id));
      });
    }

    function normalizeWord(value) {
      return value.trim().replace(/ي/g, 'ی').replace(/ك/g, 'ک');
    }

    function visibleAppend(raw) {
      const previous = chunks.map(chunk => chunk.text).join('');
      const needsSpace = previous && !/\s$/.test(previous) && !/^[\s،؛,:.!؟]/.test(raw);
      return (needsSpace ? ' ' : '') + raw;
    }

    function renderContext() {
      context.replaceChildren();
      chunks.forEach(chunk => {
        const span = document.createElement('span');
        if (chunk.kind === 'guess') span.className = 'guess-word';
        if (chunk.kind === 'model') span.className = 'model-word';
        span.textContent = chunk.text;
        context.appendChild(span);
      });
    }

    function formatProbability(value) {
      if (value > 0 && value < .01) return 'کمتر از ۰٫۰۱٪';
      return value.toLocaleString('fa-IR', { maximumFractionDigits: 2 }) + '٪';
    }

    function renderOptions(options) {
      wordList.replaceChildren();
      options.forEach(option => {
        const row = document.createElement('div');
        row.className = 'word-row';
        const labels = document.createElement('div');
        labels.className = 'word-labels';
        const word = document.createElement('strong');
        word.textContent = `«${option.word}»`;
        const probability = document.createElement('span');
        probability.textContent = formatProbability(option.probability);
        labels.append(word, probability);
        const track = document.createElement('div');
        track.className = 'track';
        const fill = document.createElement('div');
        fill.className = 'fill';
        fill.style.width = Math.min(option.probability, 100) + '%';
        track.appendChild(fill);
        row.append(labels, track);
        wordList.appendChild(row);
      });
    }

    function weightedChoice(options) {
      const total = options.reduce((sum, option) => sum + option.probability, 0);
      let cursor = Math.random() * total;
      for (const option of options) {
        cursor -= option.probability;
        if (cursor <= 0) return option;
      }
      return options.at(-1);
    }

    function finish(message) {
      guess.disabled = true;
      submit.disabled = true;
      status.textContent = message;
    }

    function startGame() {
      node = scenarios[scenarioId].root;
      chunks = [{ text: scenarios[scenarioId].seed, kind: 'seed' }];
      setup.style.display = 'none';
      game.style.display = 'block';
      results.style.display = 'none';
      guess.disabled = false;
      submit.disabled = false;
      guess.value = '';
      status.textContent = '';
      renderContext();
      guess.focus();
    }

    function submitGuess() {
      const typed = normalizeWord(guess.value);
      if (!typed) {
        status.textContent = 'یک واژه بنویسید.';
        guess.focus();
        return;
      }
      const options = node?.options || [];
      if (!options.length) {
        finish('دنباله کامل شد.');
        return;
      }
      renderOptions(options);
      results.style.display = 'block';
      const match = options.find(option => normalizeWord(option.word) === typed);
      const selected = match || weightedChoice(options);
      chunks.push({ text: visibleAppend(selected.append), kind: match ? 'guess' : 'model' });
      renderContext();
      if (match) {
        outcome.replaceChildren(document.createTextNode(`«${match.word}» در گزینه‌های مدل بود و انتخاب شد.`));
      } else {
        const strong = document.createElement('strong');
        strong.textContent = `«${selected.word}»`;
        outcome.replaceChildren(document.createTextNode('حدس شما در پنج مسیر نخست نبود. مدل '), strong, document.createTextNode(' را انتخاب کرد.'));
      }
      node = selected.next;
      guess.value = '';
      if (!node || !node.options.length) {
        finish('دنباله کامل شد.');
      } else {
        status.textContent = '';
        guess.focus();
      }
    }

    function restart() {
      game.style.display = 'none';
      setup.style.display = 'block';
      results.style.display = 'none';
      status.textContent = '';
    }

    presetButtons.forEach(button => button.addEventListener('click', () => selectScenario(button.dataset.scenario)));
    document.getElementById('start').addEventListener('click', startGame);
    document.getElementById('restart').addEventListener('click', restart);
    submit.addEventListener('click', submitGuess);
    guess.addEventListener('keydown', event => {
      if (event.key === 'Enter') {
        event.preventDefault();
        submitGuess();
      }
    });
    selectScenario(scenarioId);
  </script>
</body>
</html>
