<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <link rel="stylesheet" href="../shared/ui/tokens.css" />
    <link rel="stylesheet" href="../shared/ui/shells.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f8fc" />
    <title>مدل خام</title>
    <style>
      @font-face {
        font-family: Vazir;
        src: url('../fonts/vazir.ttf') format('truetype');
        font-display: swap;
      }
      :root {
        --paper: #f7f8fc;
        --surface: #fff;
        --ink: #293346;
        --muted: #758095;
        --line: #dce1e9;
        --accent: #6263d9;
        --soft: #eeeefb;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        min-height: 100%;
      }
      body {
        margin: 0;
        padding: clamp(12px, 4vw, 40px);
        display: grid;
        place-items: center;
        background: var(--paper);
        color: var(--ink);
        font-family: Vazir, Tahoma, sans-serif;
      }
      .chat {
        width: min(760px, 100%);
        min-height: min(780px, calc(100dvh - 24px));
        display: grid;
        grid-template-rows: auto 1fr auto;
        overflow: hidden;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 20px;
        box-shadow: 0 18px 50px #29334618;
      }
      header {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 18px 22px;
        border-bottom: 1px solid var(--line);
      }
      .avatar {
        display: grid;
        place-items: center;
        width: 42px;
        height: 42px;
        flex: 0 0 auto;
        border-radius: 13px;
        background: var(--ink);
        color: #fff;
        font-size: 21px;
      }
      h1 {
        margin: 0 0 3px;
        font-size: 19px;
      }
      .status {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
      }
      .status-dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        margin-left: 5px;
        border-radius: 50%;
        background: #4cab83;
        box-shadow: 0 0 0 4px rgba(76, 171, 131, 0.13);
        transition:
          background 200ms ease,
          box-shadow 200ms ease;
      }
      .status-dot.busy {
        background: #f59e0b;
        box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.2);
        animation: pulse-dot 1.4s ease-in-out infinite;
      }
      @keyframes pulse-dot {
        0%,
        100% {
          opacity: 1;
          box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.2);
        }
        50% {
          opacity: 0.6;
          box-shadow: 0 0 0 7px rgba(245, 158, 11, 0.05);
        }
      }
      .messages {
        overflow: auto;
        padding: 24px;
      }
      .message {
        width: fit-content;
        max-width: min(90%, 560px);
        margin: 0 0 16px;
        padding: 13px 16px;
        border-radius: 15px;
        white-space: pre-wrap;
        line-height: 2;
      }
      .message.user {
        margin-right: auto;
        background: var(--ink);
        color: #fff;
        border-bottom-right-radius: 4px;
      }
      .message.assistant {
        margin-left: auto;
        background: var(--soft);
        border-bottom-left-radius: 4px;
      }
      .message.generating::after {
        content: '▋';
        animation: blink 1s steps(2, end) infinite;
      }
      .empty {
        display: grid;
        min-height: 100%;
        place-items: center;
        text-align: center;
        color: var(--muted);
      }
      .empty strong {
        display: block;
        margin: 0;
        color: var(--muted);
        font-size: 20px;
        font-weight: 600;
      }
      .composer-wrap {
        padding: 16px 20px 20px;
        border-top: 1px solid var(--line);
      }
      .note {
        margin: 0 0 10px;
        color: var(--muted);
        font-size: 11px;
      }
      form {
        display: flex;
        align-items: flex-end;
        gap: 10px;
      }
      textarea {
        width: 100%;
        min-height: 48px;
        max-height: 140px;
        resize: none;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fff;
        color: inherit;
        font: inherit;
        line-height: 1.8;
      }
      button {
        min-width: 48px;
        min-height: 48px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fff;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        border-color: var(--accent);
      }
      button:focus-visible,
      textarea:focus-visible {
        outline: 3px solid #8586e9;
        outline-offset: 3px;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      button:disabled {
        cursor: default;
        opacity: 0.55;
      }
      #clear {
        position: absolute;
        left: 22px;
        top: 18px;
        min-width: 44px;
        min-height: 44px;
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
      @media (max-width: 560px) {
        body {
          padding: 0;
        }
        .chat {
          min-height: 100dvh;
          border: 0;
          border-radius: 0;
        }
        header {
          padding-inline: 16px 76px;
        }
        .messages {
          padding: 16px;
        }
        .composer-wrap {
          padding: 12px 12px max(12px, env(safe-area-inset-bottom));
        }
      }
    </style>
  </head>
  <body>
    <main class="chat" aria-label="شبیه‌ساز تولید تصادفی زبان">
      <header>
        <div class="avatar" aria-hidden="true">خ</div>
        <div>
          <h1>مدل خام</h1>
          <p class="status">
            <span id="dot" class="status-dot" aria-hidden="true"></span
            ><span id="status">آماده</span>
          </p>
        </div>
        <button id="clear" type="button" aria-label="پاک کردن گفت‌وگو" disabled>
          پاک
        </button>
      </header>
      <section
        id="messages"
        class="messages"
        aria-live="polite"
        aria-label="گفت‌وگو"
      >
        <div id="empty" class="empty">
          <p><strong>مدل خام</strong></p>
        </div>
      </section>
      <div class="composer-wrap">
        <form id="composer">
          <textarea
            id="prompt"
            rows="1"
            maxlength="2000"
            placeholder="موضوع یا جمله‌ای بنویس…"
            aria-label="پیام"
          ></textarea
          ><button id="send" class="primary" type="submit" aria-label="ارسال">
            ↑
          </button>
        </form>
      </div>
    </main>
    <script src="../random-generator.js?v=2"></script>
    <script>
      const messages = document.querySelector('#messages'),
        empty = document.querySelector('#empty'),
        composer = document.querySelector('#composer'),
        prompt = document.querySelector('#prompt'),
        send = document.querySelector('#send'),
        clear = document.querySelector('#clear'),
        status = document.querySelector('#status'),
        dot = document.querySelector('#dot');
      let generation = null;
      const updateState = () => {
        const has = messages.querySelector('.message');
        empty.hidden = Boolean(has);
        clear.disabled = !has;
      };
      const addMessage = (role, text) => {
        const node = document.createElement('div');
        node.className = `message ${role}`;
        node.textContent = text || '';
        messages.append(node);
        updateState();
        messages.scrollTop = messages.scrollHeight;
        return node;
      };
      const stop = () => {
        if (!generation) return;
        clearTimeout(generation.timer);
        generation.node.classList.remove('generating');
        generation = null;
        status.textContent = 'آماده';
        dot.classList.remove('busy');
        send.textContent = '↑';
        send.setAttribute('aria-label', 'ارسال');
        prompt.disabled = false;
        prompt.focus();
      };
      const generate = () => {
        const node = addMessage('assistant');
        node.classList.add('generating');
        const pieces = window.RandomPersianModel.generatePieces(
            48 + Math.floor(Math.random() * 25)
          ),
          state = { node, pieces, index: 0, timer: null };
        generation = state;
        status.textContent = 'در حال نوشتن…';
        dot.classList.add('busy');
        send.textContent = '■';
        send.setAttribute('aria-label', 'توقف');
        const next = () => {
          if (generation !== state) return;
          const piece = state.pieces[state.index++];
          if (state.index > 1 && !piece.joinLeft) node.append(' ');
          const token = document.createElement('span');
          token.textContent = piece.text;
          node.append(token);
          messages.scrollTop = messages.scrollHeight;
          if (state.index >= state.pieces.length) stop();
          else state.timer = setTimeout(next, 40 + Math.random() * 50);
        };
        state.timer = setTimeout(next, 220);
      };
      const resize = () => {
        prompt.style.height = 'auto';
        prompt.style.height = `${Math.min(prompt.scrollHeight, 140)}px`;
      };
      composer.addEventListener('submit', (event) => {
        event.preventDefault();
        if (generation) return stop();
        const text = prompt.value.trim();
        if (!text) return;
        addMessage('user', text);
        prompt.value = '';
        resize();
        prompt.disabled = true;
        generate();
      });
      clear.addEventListener('click', () => {
        stop();
        messages.querySelectorAll('.message').forEach((node) => node.remove());
        prompt.value = '';
        resize();
        updateState();
        prompt.focus();
      });
      prompt.addEventListener('input', resize);
      prompt.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
          event.preventDefault();
          composer.requestSubmit();
        }
      });
      updateState();
    </script>
  </body>
</html>
