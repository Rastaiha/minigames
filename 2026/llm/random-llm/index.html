<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>مدل خام | مدل زبانی آموزش‌ندیده</title>
  <style>
    :root {
      --page: #dfe8f3;
      --surface: #f8fafc;
      --ink: #172033;
      --muted: #748096;
      --line: #dfe5ed;
      --user: #315be8;
      --user-ink: #ffffff;
      --accent: #ff7657;
      --shadow: 0 28px 70px rgba(39, 55, 85, 0.16), 0 2px 8px rgba(39, 55, 85, 0.08);
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      padding: clamp(12px, 3vw, 32px);
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 14% 8%, rgba(255, 255, 255, 0.82), transparent 29%),
        var(--page);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .chat {
      width: min(100%, 760px);
      height: min(880px, 100%);
      min-height: 420px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 26px;
      box-shadow: var(--shadow);
    }

    header {
      min-height: 76px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      gap: 13px;
      border-bottom: 1px solid var(--line);
    }

    .avatar {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      color: white;
      background: var(--ink);
      border-radius: 13px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 22px;
      font-style: italic;
    }

    .identity { min-width: 0; }

    h1 {
      margin: 0 0 3px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 19px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .status {
      margin: 0;
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.02em;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 4px rgba(255, 118, 87, 0.13);
    }

    .messages {
      min-height: 0;
      padding: 28px 24px;
      overflow-y: auto;
      overscroll-behavior: contain;
      scroll-behavior: smooth;
      scrollbar-width: thin;
      scrollbar-color: #c8d0dc transparent;
    }

    .message {
      width: fit-content;
      max-width: min(78%, 560px);
      margin: 0 0 15px;
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.55;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      animation: arrive 180ms ease-out both;
    }

    .message.assistant {
      color: var(--ink);
      background: #e9edf3;
      border-bottom-left-radius: 5px;
    }

    .message.user {
      margin-left: auto;
      color: var(--user-ink);
      background: var(--user);
      border-bottom-right-radius: 5px;
    }

    .message.generating::after {
      content: "";
      width: 2px;
      height: 1em;
      margin-left: 3px;
      display: inline-block;
      vertical-align: -0.12em;
      background: var(--accent);
      animation: blink 760ms step-end infinite;
    }

    .composer-wrap {
      padding: 16px;
      border-top: 1px solid var(--line);
      background: rgba(248, 250, 252, 0.92);
    }

    form {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 7px 7px 7px 16px;
      background: white;
      border: 1px solid #d8dee8;
      border-radius: 19px;
      box-shadow: 0 4px 16px rgba(38, 52, 80, 0.06);
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    form:focus-within {
      border-color: rgba(49, 91, 232, 0.54);
      box-shadow: 0 0 0 4px rgba(49, 91, 232, 0.09);
    }

    textarea {
      width: 100%;
      min-height: 42px;
      max-height: 132px;
      padding: 10px 0 8px;
      resize: none;
      overflow-y: auto;
      color: var(--ink);
      background: transparent;
      border: 0;
      outline: 0;
      font: inherit;
      font-size: 15px;
      line-height: 1.45;
    }

    textarea::placeholder { color: #9ba5b5; }

    button {
      width: 42px;
      height: 42px;
      padding: 0;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      color: white;
      background: var(--ink);
      border: 0;
      border-radius: 14px;
      cursor: pointer;
      transition: transform 140ms ease, background 140ms ease, opacity 140ms ease;
    }

    button:hover:not(:disabled) { transform: translateY(-1px); background: var(--user); }
    button:active:not(:disabled) { transform: translateY(0) scale(0.97); }
    button:focus-visible { outline: 3px solid rgba(49, 91, 232, 0.28); outline-offset: 3px; }
    button:disabled { cursor: wait; opacity: 0.4; }
    button svg { width: 19px; height: 19px; }
    button .stop-icon { display: none; }
    button.is-generating .send-icon { display: none; }
    button.is-generating .stop-icon { display: block; }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes blink { 50% { opacity: 0; } }

    @media (max-width: 600px) {
      body { padding: 0; background: var(--surface); }
      .chat { width: 100%; height: 100%; min-height: 0; border: 0; border-radius: 0; box-shadow: none; }
      header { min-height: 68px; padding: 0 18px; }
      .avatar { width: 37px; height: 37px; border-radius: 12px; }
      .messages { padding: 22px 16px; }
      .message { max-width: 86%; }
      .composer-wrap { padding: 12px; padding-bottom: max(12px, env(safe-area-inset-bottom)); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <main class="chat" aria-label="گفت‌وگو با مدل خام">
    <header>
      <div class="avatar" aria-hidden="true">خ</div>
      <div class="identity">
        <h1>مدل خام</h1>
        <p class="status"><span class="status-dot" aria-hidden="true"></span><span id="statusText">در حال بارگذاری توکنایزر GPT-2…</span></p>
      </div>
    </header>

    <section class="messages" id="messages" aria-live="polite" aria-label="گفت‌وگو"></section>

    <div class="composer-wrap">
      <form id="composer">
        <textarea id="prompt" rows="1" maxlength="2000" placeholder="پیام خود را بنویسید" aria-label="پیام" disabled></textarea>
        <button id="send" type="submit" aria-label="ارسال پیام" disabled>
          <svg class="send-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <svg class="stop-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="1.5" fill="currentColor"/></svg>
        </button>
      </form>
    </div>
  </main>

    let vocab;
    let idToToken;
    let byteEncoder;
    let byteDecoder;
    let mergeRanks;
    let generation = null;
    const bpeCache = new Map();
    const textEncoder = new TextEncoder();

    function buildByteMaps() {
      const bytes = [];
      for (let i = 33; i <= 126; i++) bytes.push(i);
      for (let i = 161; i <= 172; i++) bytes.push(i);
      for (let i = 174; i <= 255; i++) bytes.push(i);
      const chars = [...bytes];
      let extra = 0;
      for (let byte = 0; byte < 256; byte++) {
        if (!bytes.includes(byte)) {
          bytes.push(byte);
          chars.push(256 + extra++);
        }
      }
      byteEncoder = new Map(bytes.map((byte, i) => [byte, String.fromCodePoint(chars[i])]));
      byteDecoder = new Map(bytes.map((byte, i) => [String.fromCodePoint(chars[i]), byte]));
    }

    function adjacentPairs(symbols) {
      const pairs = new Set();
      for (let i = 0; i < symbols.length - 1; i++) pairs.add(symbols[i] + '\u0000' + symbols[i + 1]);
      return pairs;
    }

    function bpe(token) {
      if (bpeCache.has(token)) return bpeCache.get(token);
      let symbols = Array.from(token);
      while (symbols.length > 1) {
        let bestPair = null;
        let bestRank = Infinity;
        for (const pair of adjacentPairs(symbols)) {
          const rank = mergeRanks.get(pair);
          if (rank !== undefined && rank < bestRank) {
            bestPair = pair;
            bestRank = rank;
          }
        }
        if (bestPair === null) break;
        const [left, right] = bestPair.split('\u0000');
        const merged = [];
        for (let i = 0; i < symbols.length; i++) {
          if (symbols[i] === left && symbols[i + 1] === right) {
            merged.push(left + right);
            i++;
          } else {
            merged.push(symbols[i]);
          }
        }
        symbols = merged;
      }
      bpeCache.set(token, symbols);
      return symbols;
    }

    function encode(text) {
      const pieces = text.match(/'s|'t|'re|'ve|'m|'ll|'d| ?\p{L}+| ?\p{N}+| ?[^\s\p{L}\p{N}]+|\s+(?!\S)|\s+/gu) || [];
      const ids = [];
      for (const piece of pieces) {
        const encoded = Array.from(textEncoder.encode(piece), byte => byteEncoder.get(byte)).join('');
        for (const token of bpe(encoded)) ids.push(vocab[token]);
      }
      return ids;
    }

    function tokenBytes(id) {
      const token = idToToken[id] || '';
      return Uint8Array.from(Array.from(token), character => byteDecoder.get(character));
    }

    function randomTokenId() {
      const value = new Uint32Array(1);
      crypto.getRandomValues(value);
      return value[0] % 50256;
    }

    async function loadTokenizer() {
      try {
        const binary = atob(TOKENIZER_GZIP_BASE64);
        const compressed = Uint8Array.from(binary, character => character.charCodeAt(0));
        const stream = new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'));
        const tokenizer = await new Response(stream).json();
        vocab = tokenizer.model.vocab;
        idToToken = Array(Object.keys(vocab).length);
        for (const [token, id] of Object.entries(vocab)) idToToken[id] = token;
        mergeRanks = new Map(tokenizer.model.merges.map((merge, rank) => {
          const split = merge.indexOf(' ');
          return [merge.slice(0, split) + '\u0000' + merge.slice(split + 1), rank];
        }));
        buildByteMaps();
        statusText.textContent = 'آموزش‌ندیده · توکن‌های GPT-2';
        prompt.disabled = false;
        send.disabled = false;
        prompt.focus();
      } catch (error) {
        console.error(error);
        statusText.textContent = 'توکنایزر در دسترس نیست';
      }
    }

    function addMessage(role, text = '') {
      const message = document.createElement('div');
      message.className = `message ${role}`;
      message.textContent = text;
      messages.appendChild(message);
      messages.scrollTop = messages.scrollHeight;
      return message;
    }

    function stopGeneration() {
      if (!generation) return;
      clearTimeout(generation.timer);
      const tail = generation.decoder.decode();
      if (tail) generation.element.textContent += tail;
      generation.element.classList.remove('generating');
      generation = null;
      send.classList.remove('is-generating');
      send.setAttribute('aria-label', 'ارسال پیام');
      prompt.disabled = false;
      prompt.focus();
    }

    function generate() {
      const element = addMessage('assistant');
      element.classList.add('generating');
      const state = {
        element,
        decoder: new TextDecoder('utf-8'),
        count: 0,
        limit: 42 + Math.floor(Math.random() * 24),
        timer: null
      };
      generation = state;
      send.classList.add('is-generating');
      send.setAttribute('aria-label', 'توقف تولید');

      const next = () => {
        if (generation !== state) return;
        const text = state.decoder.decode(tokenBytes(randomTokenId()), { stream: true });
        if (text) state.element.textContent += text;
        state.count++;
        messages.scrollTop = messages.scrollHeight;
        if (state.count >= state.limit) {
          stopGeneration();
          return;
        }
        state.timer = setTimeout(next, 34 + Math.random() * 54);
      };
      state.timer = setTimeout(next, 260);
    }

    function resizePrompt() {
      prompt.style.height = 'auto';
      prompt.style.height = `${Math.min(prompt.scrollHeight, 132)}px`;
    }

    composer.addEventListener('submit', event => {
      event.preventDefault();
      if (generation) {
        stopGeneration();
        return;
      }
      const text = prompt.value.trim();
      if (!text) return;
      encode(text); // The initialized model receives real GPT-2 token IDs; its output ignores them.
      addMessage('user', text);
      prompt.value = '';
      resizePrompt();
      prompt.disabled = true;
      generate();
    });

    prompt.addEventListener('input', resizePrompt);
    prompt.addEventListener('keydown', event => {
      if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
        event.preventDefault();
        composer.requestSubmit();
      }
    });

    loadTokenizer();
  </script>
</body>
</html>
