repos:
  - repo: local
    hooks:
      - id: lint
        name: ESLint
        entry: npm run lint:check --
        language: system
        pass_filenames: false
      - id: format
        name: Prettier
        entry: npm run format:check --
        language: system
        pass_filenames: false
      - id: api-boundary
        name: browser API boundary
        entry: node scripts/check-api-boundary.mjs
        language: system
        pass_filenames: false
