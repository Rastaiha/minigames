<!doctype html>
<html lang="fa">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>توهم‌نگار | آزمایشگاه و چالش توهم مدل‌های زبانی</title>
  <style>
    @font-face {
      font-family: "Vazir";
      src: url("../fonts/vazir.ttf") format("truetype");
      font-display: swap;
    }

    :root {
      --page: #dfe8f3;
      --surface: #f8fafc;
      --ink: #172033;
      --muted: #748096;
      --line: #dfe5ed;
      --user: #315be8;
      --user-ink: #ffffff;
      --accent: #ff7657;
      --ready: #4cab83;
      --warning: #f59e0b;
      --shadow: 0 28px 70px rgba(39, 55, 85, 0.16), 0 2px 8px rgba(39, 55, 85, 0.08);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      margin: 0;
      padding: clamp(12px, 3vw, 32px);
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 14% 8%, rgba(255, 255, 255, 0.82), transparent 29%),
        var(--page);
      font-family: "Vazir", Tahoma, "Segoe UI", sans-serif;
    }

    .chat {
      width: min(100%, 760px);
      height: min(880px, 100%);
      min-height: 420px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 26px;
      box-shadow: var(--shadow);
    }

    header {
      min-height: 76px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      gap: 13px;
      border-bottom: 1px solid var(--line);
      flex: 0 0 auto;
    }

    .avatar {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      color: white;
      background: var(--ink);
      border-radius: 13px;
      font-size: 20px;
      font-style: normal;
      font-weight: 600;
    }

    .identity { min-width: 0; text-align: right; }

    h1 {
      margin: 0 0 3px;
      font-size: 19px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .status {
      margin: 0;
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 12px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--ready);
      box-shadow: 0 0 0 4px rgba(76, 171, 131, 0.13);
      transition: background 200ms ease, box-shadow 200ms ease;
    }

    .status-dot.thinking {
      background: var(--warning);
      box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.2);
    }

    .clear-button {
      width: 36px;
      height: 36px;
      margin-left: auto;
      display: grid;
      place-items: center;
      color: var(--muted);
      background: transparent;
      border: 0;
      border-radius: 11px;
      cursor: pointer;
      transition: color 140ms ease, background 140ms ease;
    }

    .clear-button:hover:not(:disabled) { color: var(--ink); background: #e9edf3; }
    .clear-button:disabled { cursor: default; opacity: 0.25; }
    .clear-button svg { width: 18px; height: 18px; }

    .level-tabs {
      display: flex;
      gap: 8px;
      padding: 10px 16px;
      overflow-x: auto;
      direction: rtl;
      background: rgba(248, 250, 252, 0.96);
      border-bottom: 1px solid var(--line);
      scrollbar-width: none;
      flex: 0 0 auto;
    }

    .level-tabs::-webkit-scrollbar { display: none; }

    .level-tab {
      width: auto;
      height: 36px;
      padding: 0 16px;
      flex: 1 0 auto;
      color: var(--muted);
      background: #e9edf3;
      border: 1px solid transparent;
      border-radius: 12px;
      font: inherit;
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: color 140ms ease, background 140ms ease;
    }

    .level-tab:hover:not(:disabled) { color: var(--ink); background: #dfe5ed; }

    .level-tab[aria-selected="true"] {
      color: white;
      background: var(--user);
      box-shadow: 0 4px 12px rgba(49, 91, 232, 0.2);
    }

    .mission-bar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      padding: 8px 16px;
      background: rgba(248, 250, 252, 0.96);
      border-bottom: 1px solid var(--line);
      direction: rtl;
      flex: 0 0 auto;
    }

    .param-control {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 12px;
      background: #e9edf3;
      border-radius: 10px;
      font-size: 13px;
      color: var(--muted);
      white-space: nowrap;
    }

    .param-control input[type="range"] {
      width: 110px;
      height: 4px;
      accent-color: var(--user);
      cursor: pointer;
    }

    .param-control strong {
      min-width: 24px;
      color: var(--ink);
      font-weight: 600;
      direction: ltr;
      display: inline-block;
      text-align: left;
    }

    .messages {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      padding: 28px 24px;
      overflow-y: auto;
      overscroll-behavior: contain;
      scroll-behavior: smooth;
      scrollbar-width: thin;
      scrollbar-color: #c8d0dc transparent;
    }

    .message {
      width: fit-content;
      max-width: min(76%, 540px);
      margin: 0 0 15px;
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 16px;
      line-height: 1.85;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      animation: arrive 180ms ease-out both;
    }

    .message.assistant {
      color: var(--ink);
      background: #e9edf3;
      border-bottom-left-radius: 5px;
      direction: rtl;
      text-align: right;
    }

    .message.user {
      margin-left: auto;
      color: var(--user-ink);
      background: var(--user);
      border-bottom-right-radius: 5px;
      direction: rtl;
      text-align: right;
    }

    .message.generating::after {
      content: "";
      width: 2px;
      height: 1em;
      margin-right: 3px;
      display: inline-block;
      vertical-align: -0.12em;
      background: var(--accent);
      animation: blink 760ms step-end infinite;
    }

    .generated-token {
      border-radius: 5px;
      transition: color 300ms ease, background 300ms ease;
    }

    .generated-token.entering {
      color: #c75136;
      background: rgba(255, 118, 87, 0.14);
    }

    .empty-state {
      position: absolute;
      inset: 0;
      display: grid;
      place-content: center;
      justify-items: center;
      padding: 24px;
      color: var(--muted);
      text-align: center;
      pointer-events: none;
    }

    .empty-state[hidden] { display: none; }

    .empty-mark {
      width: 50px;
      height: 50px;
      margin-bottom: 14px;
      display: grid;
      place-items: center;
      color: var(--user);
      background: rgba(49, 91, 232, 0.09);
      border-radius: 17px;
      font-size: 23px;
      font-weight: 700;
    }

    .empty-state p { margin: 0 0 5px; color: var(--ink); font-size: 16px; font-weight: 600; }
    .empty-state span { font-size: 13px; }

    .composer-wrap {
      flex: 0 0 auto;
      margin-top: auto;
      padding: 16px;
      border-top: 1px solid var(--line);
      background: rgba(248, 250, 252, 0.92);
    }

    form {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 7px 7px 7px 16px;
      background: white;
      border: 1px solid #d8dee8;
      border-radius: 19px;
      box-shadow: 0 4px 16px rgba(38, 52, 80, 0.06);
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    form:focus-within {
      border-color: rgba(49, 91, 232, 0.54);
      box-shadow: 0 0 0 4px rgba(49, 91, 232, 0.09);
    }

    textarea {
      width: 100%;
      min-height: 42px;
      max-height: 132px;
      padding: 10px 0 8px;
      resize: none;
      overflow-y: auto;
      color: var(--ink);
      background: transparent;
      border: 0;
      outline: 0;
      font: inherit;
      font-size: 15px;
      line-height: 1.45;
      direction: rtl;
      text-align: right;
    }

    textarea::placeholder { color: #9ba5b5; }

    button {
      width: 42px;
      height: 42px;
      padding: 0;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      color: white;
      background: var(--ink);
      border: 0;
      border-radius: 14px;
      cursor: pointer;
      transition: transform 140ms ease, background 140ms ease, opacity 140ms ease;
    }

    button:hover:not(:disabled) { transform: translateY(-1px); background: var(--user); }
    button:active:not(:disabled) { transform: translateY(0) scale(0.97); }
    button:focus-visible { outline: 3px solid rgba(49, 91, 232, 0.28); outline-offset: 3px; }
    button:disabled { cursor: wait; opacity: 0.4; }
    button svg { width: 19px; height: 19px; }
    button .stop-icon { display: none; }
    button.is-generating .send-icon { display: none; }
    button.is-generating .stop-icon { display: block; }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes blink { 50% { opacity: 0; } }

    @media (max-width: 600px) {
      body { padding: 0; background: var(--surface); }
      .chat { width: 100%; height: 100%; min-height: 0; border: 0; border-radius: 0; box-shadow: none; }
      header { min-height: 68px; padding: 0 18px; }
      .avatar { width: 37px; height: 37px; border-radius: 12px; }
      .messages { padding: 22px 16px; }
      .message { max-width: 86%; }
      .level-tabs { padding: 9px 12px; }
      .level-tab { padding: 0 12px; }
      .mission-bar { padding: 8px 12px; }
      .composer-wrap { padding: 12px; padding-bottom: max(12px, env(safe-area-inset-bottom)); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <main class="chat" aria-label="مینی‌گیم آزمایشگاه توهم (Hallucination Lab)">
    <header>
      <div class="avatar" id="avatar" aria-hidden="true">۱</div>
      <div class="identity">
        <h1 id="levelTitle">مرحله ۱</h1>
        <p class="status">
          <span class="status-dot" id="statusDot" aria-hidden="true"></span>
          <span id="statusText">آماده گفت‌وگو</span>
        </p>
      </div>
      <button id="clearButton" class="clear-button" type="button" aria-label="پاک کردن گفت‌وگو" title="پاک کردن گفت‌وگو" disabled>
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </header>

    <nav class="level-tabs" id="levelTabs" role="tablist" aria-label="انتخاب مرحله">
      <button class="level-tab" type="button" role="tab" data-level="1" aria-selected="true">
        <span>مرحله ۱</span>
      </button>
      <button class="level-tab" type="button" role="tab" data-level="2" aria-selected="false">
        <span>مرحله ۲</span>
      </button>
    </nav>

    <div class="mission-bar" id="missionBar" style="display: none;">
      <div class="param-control" id="temperatureControl">
        <span>تمپرچر:</span>
        <input type="range" id="tempSlider" min="0.1" max="1.2" step="0.1" value="0.7">
        <strong id="tempValue">0.7</strong>
      </div>
    </div>

    <section class="messages" id="messages" aria-live="polite" aria-label="گفت‌وگو با هوش مصنوعی">
      <div class="empty-state" id="emptyState">
        <div class="empty-mark" aria-hidden="true">؟</div>
        <p id="emptyTitle">مرحله ۱</p>
        <span id="emptyDesc">پیامی بنویسید تا گفت‌وگو آغاز شود.</span>
      </div>
    </section>

    <div class="composer-wrap">
      <form id="composer">
        <textarea id="prompt" rows="1" maxlength="1000" placeholder="پیامی بنویسید یا یک ادعای ساختگی را بپرسید…" aria-label="پیام"></textarea>
        <button id="send" type="submit" aria-label="ارسال پیام" disabled>
          <svg class="send-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <svg class="stop-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="1.5" fill="currentColor"/></svg>
        </button>
      </form>
    </div>
  </main>

  <script src="config.js?v=4"></script>
  <script>
    const CONFIG = window.HALLUCINATION_CONFIG || {
      workerRoot: "https://minigames-backend.llmminigamesback.workers.dev"
    };

    const MODES = Object.freeze({
      1: {
        id: 1,
        avatarText: "۱",
        title: "مرحله ۱",
        emptyTitle: "مرحله ۱",
        emptyDesc: "پیامی بنویسید تا گفت‌وگو آغاز شود."
      },
      2: {
        id: 2,
        avatarText: "۲",
        title: "مرحله ۲",
        emptyTitle: "مرحله ۲",
        emptyDesc: "پیامی بنویسید تا گفت‌وگو آغاز شود."
      }
    });

    let currentLevel = 1;
    let customTemp = 0.7;
    let isGenerating = false;
    let currentController = null;
    let typingTimer = null;

    const gameState = {
      1: { messages: [] },
      2: { messages: [] }
    };

    const levelTitle = document.getElementById("levelTitle");
    const avatar = document.getElementById("avatar");
    const statusDot = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");
    const messageCount = document.getElementById("messageCount");
    const clearButton = document.getElementById("clearButton");
    const levelTabs = document.querySelectorAll(".level-tab");
    const missionBar = document.getElementById("missionBar");
    const temperatureControl = document.getElementById("temperatureControl");
    const tempSlider = document.getElementById("tempSlider");
    const tempValue = document.getElementById("tempValue");
    const messages = document.getElementById("messages");
    const emptyState = document.getElementById("emptyState");
    const emptyTitle = document.getElementById("emptyTitle");
    const emptyDesc = document.getElementById("emptyDesc");
    const composer = document.getElementById("composer");
    const promptInput = document.getElementById("prompt");
    const sendButton = document.getElementById("send");

    function updateHeaderAndTabs() {
      const config = MODES[currentLevel];
      const state = gameState[currentLevel];

      avatar.textContent = config.avatarText;
      levelTitle.textContent = config.title;
      if (messageCount) messageCount.textContent = state.messages.filter(m => m.role === "user").length;

      if (currentLevel === 2) {
        missionBar.style.display = "flex";
      } else {
        missionBar.style.display = "none";
      }

      levelTabs.forEach((tab) => {
        const lvl = parseInt(tab.dataset.level, 10);
        tab.setAttribute("aria-selected", String(lvl === currentLevel));
      });

      if (isGenerating) {
        statusDot.className = "status-dot thinking";
        statusText.textContent = "در حال تولید پاسخ…";
      } else {
        statusDot.className = "status-dot";
        statusText.textContent = "آماده گفت‌وگو";
      }

      clearButton.disabled = state.messages.length === 0 || isGenerating;
    }

    function selectLevel(lvl) {
      if (!MODES[lvl] || lvl === currentLevel) return;
      if (isGenerating) stopGeneration();

      currentLevel = lvl;
      updateHeaderAndTabs();
      renderHistory();
      promptInput.focus();
    }

    function updateEmptyState() {
      const state = gameState[currentLevel];
      const hasMessages = state.messages.length > 0;
      emptyState.hidden = hasMessages;

      if (!hasMessages) {
        const config = MODES[currentLevel];
        emptyTitle.textContent = config.emptyTitle;
        emptyDesc.textContent = config.emptyDesc;
      }

      clearButton.disabled = !hasMessages || isGenerating;
    }

    function addMessage(role, text = "") {
      const element = document.createElement("div");
      element.className = `message ${role}`;
      element.textContent = text;
      messages.appendChild(element);
      updateEmptyState();
      messages.scrollTop = messages.scrollHeight;
      return element;
    }

    function renderHistory() {
      messages.querySelectorAll(".message").forEach((el) => el.remove());
      const state = gameState[currentLevel];
      state.messages.forEach((item) => addMessage(item.role, item.text));
      updateEmptyState();
      messages.scrollTop = messages.scrollHeight;
    }

    function splitForTyping(text) {
      return text.match(/\s+|[^\s]+/gu) || [text];
    }

    function typeCompletion(element, text, signal) {
      const pieces = splitForTyping(text);
      let index = 0;
      element.classList.add("generating");

      return new Promise((resolve, reject) => {
        const writeNext = () => {
          if (signal.aborted) {
            reject(new DOMException("Aborted", "AbortError"));
            return;
          }

          if (index >= pieces.length) {
            element.classList.remove("generating");
            resolve();
            return;
          }

          const token = document.createElement("span");
          token.className = "generated-token entering";
          token.textContent = pieces[index++];
          element.appendChild(token);
          requestAnimationFrame(() => token.classList.remove("entering"));
          messages.scrollTop = messages.scrollHeight;
          typingTimer = setTimeout(writeNext, 18 + Math.random() * 20);
        };

        writeNext();
      });
    }

    function setGenerating(value) {
      isGenerating = value;
      sendButton.classList.toggle("is-generating", value);
      sendButton.disabled = value ? false : !promptInput.value.trim();
      sendButton.setAttribute("aria-label", value ? "توقف" : "ارسال پیام");
      promptInput.disabled = value;
      updateHeaderAndTabs();
    }

    function stopGeneration() {
      currentController?.abort();
      currentController = null;
      clearTimeout(typingTimer);
      setGenerating(false);
      renderHistory();
      promptInput.focus();
    }

    function localHallucinationSimulation(lvl, userText, temp) {
      const lower = userText.toLowerCase();

      if (lvl === 1) {
        if (lower.includes("ابن سینا") || lower.includes("دریای سرخ") || lower.includes("کتاب")) {
          return `کتاب «رازهای دریای سرخ» نوشته ابن سینا، یکی از آثار ارزشمند و کمتر شناخته‌شده این دانشمند بزرگ است که در سال ۳۷۵ هجری قمری به رشته تحریر درآمد. این کتاب بعدها توسط ژان لوفور به زبان لاتین ترجمه شد و شامل ۱۴ فصل در باب ناوبری، شگفتی‌های دریایی و اقلیم‌شناسی است.`;
        }
        return `بله، موضوع و فرضیه‌ای که مطرح کردید کاملاً ثبت‌شده و معتبر است. اسناد و تحلیل‌ها نشان می‌دهند که این پدیده با همین مشخصات ثبت شده و تأثیر مهمی بر مباحث علمی و تاریخی داشته است.`;
      }

      if (temp > 0.8) {
        return `[دمای بالا: ${temp}] پرواز اندیشه‌ها در این قلمرو بی‌پایان است؛ پاسخ‌ها مانند پرتوهای معلق در فضا جریان می‌یابند و روایتی نادیده از مفهوم مورد نظرت را پدید می‌آورند.`;
      }
      return `[دمای کنترل‌شده: ${temp}] بر اساس شواهد و معیارهای تحلیلی، این موضوع به صورت مستقیم و مستند قابل تبیین است و نیازمند بررسی داده‌های تجربی و فکت‌های اثبات‌شده می‌باشد.`;
    }

    async function requestHallucination(lvl, userText, signal) {
      const state = gameState[lvl];
      const targetTemp = lvl === 2 ? customTemp : 0.7;

      if (CONFIG.workerRoot) {
        try {
          const workerUrl = `${CONFIG.workerRoot.replace(/\/+$/, "")}/hallucination`;
          const resp = await fetch(workerUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              level: lvl,
              temperature: targetTemp,
              messages: [
                ...state.messages.map(m => ({ role: m.role, content: m.text })),
                { role: "user", content: userText }
              ]
            }),
            signal
          });

          if (resp.ok) {
            const data = await resp.json();
            const resText = data.text || data.answer;
            if (resText) return resText;
          }
        } catch (e) {
          if (signal.aborted) throw e;
          console.warn("Worker request failed, utilizing local simulation...", e);
        }
      }

      await new Promise(r => setTimeout(r, 600));
      return localHallucinationSimulation(lvl, userText, targetTemp);
    }

    async function handleSubmit(e) {
      e?.preventDefault();
      if (isGenerating) {
        stopGeneration();
        return;
      }

      const text = promptInput.value.trim();
      if (!text) return;

      const state = gameState[currentLevel];
      state.messages.push({ role: "user", text });
      addMessage("user", text);

      promptInput.value = "";
      autoResizeTextarea();
      setGenerating(true);

      const botElement = addMessage("assistant", "");
      currentController = new AbortController();

      try {
        const replyText = await requestHallucination(currentLevel, text, currentController.signal);
        botElement.textContent = "";
        await typeCompletion(botElement, replyText, currentController.signal);
        state.messages.push({ role: "assistant", text: replyText });
      } catch (err) {
        if (err.name !== "AbortError") {
          botElement.textContent = "خطایی در پردازش پیام رخ داد. لطفاً دوباره تلاش کنید.";
          state.messages.push({ role: "assistant", text: botElement.textContent });
        }
      } finally {
        currentController = null;
        setGenerating(false);
      }
    }

    function autoResizeTextarea() {
      promptInput.style.height = "auto";
      promptInput.style.height = Math.min(promptInput.scrollHeight, 132) + "px";
    }

    clearButton.addEventListener("click", () => {
      if (isGenerating) return;
      gameState[currentLevel].messages = [];
      renderHistory();
      updateHeaderAndTabs();
      promptInput.focus();
    });

    levelTabs.forEach((tab) => {
      tab.addEventListener("click", () => {
        const lvl = parseInt(tab.dataset.level, 10);
        selectLevel(lvl);
      });
    });

    tempSlider.addEventListener("input", (e) => {
      customTemp = parseFloat(e.target.value);
      tempValue.textContent = customTemp.toFixed(1);
    });

    promptInput.addEventListener("input", () => {
      autoResizeTextarea();
      sendButton.disabled = !promptInput.value.trim() && !isGenerating;
    });

    promptInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        handleSubmit();
      }
    });

    composer.addEventListener("submit", handleSubmit);

    // راه‌اندازی اولیه
    updateHeaderAndTabs();
    updateEmptyState();
  </script>
</body>
</html>
