<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <link rel="stylesheet" href="../shared/ui/tokens.css" />
    <link rel="stylesheet" href="../shared/ui/shells.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eef3f9" />
    <title>جعبه‌ی یادگیرنده</title>
    <style>
      :root {
        --ink: #172033;
        --muted: #768196;
        --line: #dce4ef;
        --surface: #ffffff;
        --soft: #f5f7fb;
        --blue: #3562e9;
        --green: #36a978;
        --green-soft: #eaf8f2;
        --orange: #e69a45;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        color: var(--ink);
        background:
          radial-gradient(
            circle at 50% 24%,
            rgba(83, 113, 227, 0.12),
            transparent 34%
          ),
          #eef3f9;
        font-family: 'Vazir Local', Tahoma, sans-serif;
      }

      button {
        font: inherit;
      }

      .app {
        width: min(540px, 100%);
        text-align: center;
      }

      .learning-box {
        position: relative;
        padding: 18px 22px;
        overflow: hidden;
        background: var(--surface);
        border: 1px solid rgba(202, 214, 230, 0.9);
        border-radius: 22px;
        box-shadow: 0 16px 45px rgba(30, 53, 88, 0.1);
      }

      .reset-button {
        position: absolute;
        top: 13px;
        left: 13px;
        width: 32px;
        height: 32px;
        display: grid;
        place-items: center;
        color: var(--muted);
        background: transparent;
        border: 0;
        border-radius: 50%;
        cursor: pointer;
        font-size: 15px;
        transition: 150ms ease;
      }

      .reset-button:hover {
        color: var(--ink);
        background: var(--soft);
      }
      .reset-button:disabled {
        cursor: wait;
        opacity: 0.4;
      }
      .sample-count {
        display: block;
        margin-bottom: 8px;
        color: var(--muted);
        font-size: 11px;
      }

      .sentence-card {
        padding: 10px 14px;
        text-align: right;
        background: var(--soft);
        border: 1px solid #e5eaf2;
        border-radius: 13px;
      }

      .sentence-label {
        display: block;
        margin-bottom: 4px;
        color: var(--muted);
        font-size: 11px;
      }
      .sentence {
        margin: 0;
        font-size: clamp(15px, 3.4vw, 17px);
        font-weight: 700;
        line-height: 1.6;
      }
      .cursor {
        color: var(--blue);
        animation: blink 900ms step-end infinite;
      }

      .box-stage {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin: 8px 0;
        padding: 6px 12px;
        background: var(--soft);
        border: 1px solid #e5eaf2;
        border-radius: 11px;
        min-height: 34px;
        transition: background 250ms ease, border-color 250ms ease;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #94a3b8;
        flex-shrink: 0;
        transition: background 250ms ease, transform 250ms ease;
      }

      .box-stage.working {
        background: rgba(53, 98, 233, 0.06);
        border-color: rgba(53, 98, 233, 0.25);
      }

      .box-stage.working .status-dot {
        background: var(--blue);
        animation: statusPulse 700ms ease-in-out infinite alternate;
      }

      .box-stage.training {
        background: rgba(230, 154, 69, 0.08);
        border-color: rgba(230, 154, 69, 0.3);
      }

      .box-stage.training .status-dot {
        background: var(--orange);
        animation: statusPulse 550ms ease-in-out infinite alternate;
      }

      .box-stage.done {
        background: rgba(54, 169, 120, 0.08);
        border-color: rgba(54, 169, 120, 0.28);
      }

      .box-stage.done .status-dot {
        background: var(--green);
        transform: scale(1.15);
      }

      @keyframes statusPulse {
        from {
          transform: scale(0.75);
          opacity: 0.5;
        }
        to {
          transform: scale(1.35);
          opacity: 1;
        }
      }

      .box-status {
        color: #4b5563;
        font-size: 11.5px;
        font-weight: 600;
        line-height: 1.5;
      }

      .send-button,
      .train-button,
      .next-button {
        width: 100%;
        min-height: 42px;
        padding: 9px 16px;
        color: white;
        border: 0;
        border-radius: 12px;
        font-weight: 700;
        font-size: 13.5px;
        cursor: pointer;
        transition:
          transform 150ms ease,
          opacity 150ms ease;
      }

      .send-button {
        background: var(--blue);
        box-shadow: 0 8px 18px rgba(53, 98, 233, 0.2);
      }
      .train-button {
        background: linear-gradient(135deg, #e69a45, #dd764f);
        box-shadow: 0 8px 18px rgba(230, 154, 69, 0.2);
      }
      .next-button {
        background: var(--blue);
        box-shadow: 0 8px 18px rgba(53, 98, 233, 0.2);
      }
      .send-button:hover,
      .train-button:hover,
      .next-button:hover {
        transform: translateY(-1px);
      }
      .send-button:disabled,
      .train-button:disabled {
        cursor: wait;
        opacity: 0.55;
        transform: none;
      }

      .results {
        display: grid;
        grid-template-rows: 0fr;
        opacity: 0;
        transition:
          grid-template-rows 400ms ease,
          opacity 300ms ease;
      }

      .results.visible {
        grid-template-rows: 1fr;
        opacity: 1;
      }
      .results-inner {
        min-height: 0;
        overflow: hidden;
      }
      .results-content {
        padding-top: 2px;
        border-top: 1px solid var(--line);
      }

      .results-heading {
        margin: 10px 0 7px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        font-size: 12px;
      }

      .results-heading span {
        color: var(--muted);
        font-size: 10.5px;
        font-weight: 400;
      }
      .probability-list {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      .probability-row {
        position: relative;
        padding: 7px 11px;
        text-align: right;
        background: var(--soft);
        border: 1px solid #e5eaf2;
        border-radius: 10px;
        transition:
          transform 650ms cubic-bezier(0.2, 0.8, 0.2, 1),
          background 300ms ease,
          border-color 300ms ease,
          box-shadow 300ms ease;
        will-change: transform;
      }

      .probability-row.target {
        background: var(--green-soft);
        border-color: rgba(54, 169, 120, 0.32);
      }

      .probability-row.target.boosted {
        border-color: rgba(54, 169, 120, 0.75);
        box-shadow: 0 0 0 3px rgba(54, 169, 120, 0.18);
      }

      .probability-meta {
        margin-bottom: 4px;
        display: flex;
        align-items: center;
        gap: 7px;
      }

      .token {
        font-size: 13px;
        font-weight: 700;
        min-width: 44px;
      }

      .target-tag {
        padding: 2px 6px;
        color: #237657;
        background: rgba(54, 169, 120, 0.14);
        border-radius: 999px;
        font-size: 9px;
        font-weight: 600;
      }

      .value {
        margin-right: auto;
        color: var(--ink);
        font-size: 11.5px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .delta {
        display: inline-flex;
        align-items: center;
        gap: 2px;
        padding: 1px 6px;
        border-radius: 6px;
        font-size: 10px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        opacity: 0;
        transform: translateY(2px);
        transition:
          opacity 350ms ease,
          transform 350ms ease;
      }
      .delta.visible {
        opacity: 1;
        transform: translateY(0);
      }
      .delta.positive {
        color: #1b7348;
        background: rgba(54, 169, 120, 0.18);
      }
      .delta.negative {
        color: #c53c44;
        background: rgba(223, 92, 98, 0.12);
      }

      .track {
        height: 6px;
        overflow: hidden;
        background: #e5eaf2;
        border-radius: 999px;
      }

      .fill {
        width: 0;
        height: 100%;
        background: linear-gradient(90deg, #88a7f8, var(--blue));
        border-radius: inherit;
        transition: width 800ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      .probability-row.target .fill {
        background: linear-gradient(90deg, #72d3aa, var(--green));
      }

      .truth-row {
        margin: 8px 0;
        padding: 6px 11px;
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        background: #fbfcfe;
        border: 1px solid var(--line);
        border-radius: 10px;
        font-size: 11px;
      }

      .truth-token {
        padding: 2px 9px;
        color: #237657;
        background: #dff4eb;
        border-radius: 7px;
        font-size: 13px;
      }

      .change-note {
        min-height: 16px;
        margin: 6px 0 0;
        color: var(--green);
        font-size: 11px;
        font-weight: 600;
      }

      .complete-message {
        display: none;
        padding: 10px 12px;
        color: #28795d;
        background: var(--green-soft);
        border: 1px solid #ccebdd;
        border-radius: 12px;
        font-size: 11.5px;
        line-height: 1.8;
      }

      .complete-message.visible {
        display: block;
      }
      [hidden] {
        display: none !important;
      }

      @keyframes blink {
        50% {
          opacity: 0;
        }
      }

      @media (max-width: 520px) {
        body {
          padding: 8px;
        }
        .learning-box {
          padding: 14px 14px;
          border-radius: 16px;
        }
        .sentence {
          font-size: 14.5px;
        }
        .token {
          font-size: 12px;
          min-width: 38px;
        }
        .value {
          font-size: 11px;
        }
        .probability-row {
          padding: 6px 9px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <section class="learning-box">
        <button
          class="reset-button"
          id="resetButton"
          type="button"
          aria-label="شروع دوباره"
          title="شروع دوباره"
        >
          ↻
        </button>
        <span class="sample-count" id="sampleCount"></span>

        <div class="sentence-card">
          <span class="sentence-label">متن ورودی</span>
          <p class="sentence">
            <span id="sentenceText"></span> <span class="cursor">▌</span>
          </p>
        </div>

        <div class="box-stage" id="boxStage" aria-live="polite">
          <span class="status-dot" aria-hidden="true"></span>
          <span class="box-status" id="boxStatus">جمله را به جعبه بده</span>
        </div>

        <button class="send-button" id="sendButton" type="button">
          جمله را به جعبه بده
        </button>

        <div class="results" id="results">
          <div class="results-inner">
            <div class="results-content">
              <div class="results-heading">
                <strong>احتمال توکن بعدی</strong>
                <span>شبیه‌سازی آموزشی · مجموع ۱۰۰٪</span>
              </div>
              <div class="probability-list" id="probabilityList"></div>
              <div class="truth-row">
                <span>توکنی که واقعاً در متن آمده:</span>
                <strong class="truth-token" id="truthToken"></strong>
              </div>
              <button class="train-button" id="trainButton" type="button">
                آموزش با این نمونه
              </button>
              <button class="next-button" id="nextButton" type="button" hidden>
                نمونه‌ی بعدی
              </button>
              <p class="change-note" id="changeNote"></p>
            </div>
          </div>
        </div>

        <p class="complete-message" id="completeMessage">
          همه‌ی نمونه‌ها دیده شدند. جعبه بعد از هر متن، فقط کمی تغییر کرد.
        </p>
      </section>
    </main>

    <script type="module">
      import { softmax, trainLogits } from './logic.js';

      const EXAMPLES = Object.freeze([
        {
          prompt: 'توانا بود هر که دانا',
          target: 'بود',
          candidates: ['است', 'بود', 'شد', 'ماند', 'رفت'],
          logits: [1.05, -0.15, 0.55, 0.05, -0.45],
        },
        {
          prompt: 'نابرده رنج، گنج میسر',
          target: 'نمی‌شود',
          candidates: ['است', 'نمی‌شود', 'شد', 'می‌شود', 'ماند'],
          logits: [0.95, -0.35, 0.15, 0.65, -0.25],
        },
        {
          prompt: 'ز گهواره تا گور دانش',
          target: 'بجوی',
          candidates: ['بجوی', 'بخوان', 'باشد', 'آموز', 'بمان'],
          logits: [-0.25, 0.75, 0.2, 0.55, -0.4],
        },
        {
          prompt: 'هر که بامش بیش، برفش',
          target: 'بیشتر',
          candidates: ['بیشتر', 'سفید', 'سنگین', 'بسیار', 'کمتر'],
          logits: [-0.2, 0.3, 0.85, 0.5, -0.4],
        },
        {
          prompt: 'بنی‌آدم اعضای یکدیگرند که در آفرینش ز یک',
          target: 'گوهرند',
          candidates: ['گوهرند', 'جهانند', 'پیکرند', 'خانه‌اند', 'داستانند'],
          logits: [-0.45, 0.25, 0.9, 0.05, -0.2],
        },
        {
          prompt: 'تو نیکی می‌کن و در دجله',
          target: 'انداز',
          candidates: ['انداز', 'بگذار', 'بمان', 'بنشین', 'بخوان'],
          logits: [-0.35, 0.8, 0.3, -0.1, 0.15],
        },
      ]);

      const LEARNING_STEP = 0.28;
      const sentenceText = document.querySelector('#sentenceText');
      const sampleCount = document.querySelector('#sampleCount');
      const boxStage = document.querySelector('#boxStage');
      const boxStatus = document.querySelector('#boxStatus');
      const sendButton = document.querySelector('#sendButton');
      const results = document.querySelector('#results');
      const probabilityList = document.querySelector('#probabilityList');
      const truthToken = document.querySelector('#truthToken');
      const trainButton = document.querySelector('#trainButton');
      const nextButton = document.querySelector('#nextButton');
      const changeNote = document.querySelector('#changeNote');
      const completeMessage = document.querySelector('#completeMessage');
      const resetButton = document.querySelector('#resetButton');

      let currentIndex = 0;
      let logits = [...EXAMPLES[0].logits];
      let phase = 'ready';
      let busy = false;
      let targetIncrease = 0;
      let probabilityChanges = [];
      const rowMap = new Map();

      function delay(milliseconds) {
        return new Promise((resolve) => setTimeout(resolve, milliseconds));
      }

      function formatNumber(value) {
        return value.toLocaleString('fa-IR');
      }

      function formatPercent(value) {
        return (
          (value * 100).toLocaleString('fa-IR', {
            minimumFractionDigits: 1,
            maximumFractionDigits: 1,
          }) + '٪'
        );
      }

      function currentExample() {
        return EXAMPLES[currentIndex];
      }

      function animateNumber(element, start, end, duration = 800) {
        const startTime = performance.now();
        function tick(currentTime) {
          const elapsed = currentTime - startTime;
          const progress = Math.min(elapsed / duration, 1);
          const eased = 1 - Math.pow(1 - progress, 3);
          const current = start + (end - start) * eased;
          element.textContent = formatPercent(current);
          if (progress < 1) {
            requestAnimationFrame(tick);
          } else {
            element.textContent = formatPercent(end);
          }
        }
        requestAnimationFrame(tick);
      }

      function renderInitialProbabilities(probabilities) {
        const example = currentExample();
        const targetIndex = example.candidates.indexOf(example.target);
        const sorted = probabilities
          .map((probability, index) => ({ probability, index }))
          .sort((a, b) => b.probability - a.probability);

        probabilityList.innerHTML = '';
        rowMap.clear();

        sorted.forEach(({ probability, index }) => {
          const isTarget = index === targetIndex;
          const row = document.createElement('div');
          row.className = 'probability-row' + (isTarget ? ' target' : '');
          row.dataset.index = String(index);

          const meta = document.createElement('div');
          meta.className = 'probability-meta';

          const token = document.createElement('span');
          token.className = 'token';
          token.textContent = example.candidates[index];

          const tag = document.createElement('span');
          tag.className = 'target-tag';
          tag.textContent = 'توکن واقعی';
          tag.hidden = !isTarget;

          const delta = document.createElement('span');
          delta.className = 'delta';

          const value = document.createElement('span');
          value.className = 'value';
          value.textContent = formatPercent(0);

          const track = document.createElement('div');
          track.className = 'track';
          const fill = document.createElement('div');
          fill.className = 'fill';
          track.appendChild(fill);

          meta.append(token, tag, delta, value);
          row.append(meta, track);
          probabilityList.appendChild(row);

          rowMap.set(index, { row, value, delta, fill, token });

          requestAnimationFrame(() => {
            fill.style.width = probability * 100 + '%';
            animateNumber(value, 0, probability, 600);
          });
        });
      }

      function renderReady() {
        const example = currentExample();
        sentenceText.textContent = example.prompt;
        truthToken.textContent = example.target;
        sampleCount.textContent =
          'نمونه‌ی ' +
          formatNumber(currentIndex + 1) +
          ' از ' +
          formatNumber(EXAMPLES.length);
        boxStage.className = 'box-stage';
        boxStatus.textContent = 'جمله را به جعبه بده';
        results.classList.remove('visible');
        completeMessage.classList.remove('visible');
        sendButton.hidden = false;
        sendButton.disabled = false;
        trainButton.hidden = false;
        trainButton.disabled = false;
        nextButton.hidden = true;
        changeNote.textContent = '';
        resetButton.disabled = false;
        rowMap.clear();
        probabilityList.innerHTML = '';
      }

      async function sendSentence() {
        if (busy || phase !== 'ready') return;
        busy = true;
        phase = 'analysing';
        sendButton.disabled = true;
        resetButton.disabled = true;
        boxStage.className = 'box-stage working';
        boxStatus.textContent = 'در حال ساختن احتمال‌ها...';

        await delay(650);
        renderInitialProbabilities(softmax(logits));
        phase = 'shown';
        busy = false;
        boxStage.className = 'box-stage';
        boxStatus.textContent = 'احتمال‌ها آماده‌اند';
        sendButton.hidden = true;
        results.classList.add('visible');
        resetButton.disabled = false;
      }

      async function train() {
        if (busy || phase !== 'shown') return;
        busy = true;
        phase = 'training';
        trainButton.disabled = true;
        resetButton.disabled = true;
        boxStage.className = 'box-stage training';
        boxStatus.textContent = 'در حال به‌روزرسانی احتمال‌ها...';

        const example = currentExample();
        const before = softmax(logits);
        const targetIndex = example.candidates.indexOf(example.target);

        logits = trainLogits(logits, targetIndex, LEARNING_STEP);
        const after = softmax(logits);

        probabilityChanges = after.map(
          (probability, index) => probability - before[index]
        );
        targetIncrease = probabilityChanges[targetIndex];

        // Highlight target row
        const targetItem = rowMap.get(targetIndex);
        if (targetItem) {
          targetItem.row.classList.add('boosted');
        }

        // Animate fills, numbers, and show delta badges on EXISTING elements
        example.candidates.forEach((_, index) => {
          const item = rowMap.get(index);
          if (!item) return;

          const probBefore = before[index];
          const probAfter = after[index];
          const change = probabilityChanges[index];

          // Bar width transition
          item.fill.style.width = probAfter * 100 + '%';

          // Animate number count
          animateNumber(item.value, probBefore, probAfter, 800);

          // Delta indicator (+ / -)
          const isPositive = change > 0.00001;
          const isNegative = change < -0.00001;
          item.delta.className =
            'delta visible ' + (isPositive ? 'positive' : 'negative');
          item.delta.textContent =
            (isPositive ? '↑ +' : '↓ −') +
            formatPercent(Math.abs(change));
        });

        // FLIP animation to smoothly glide rows if ranking changed
        await delay(320);

        const prevTops = new Map();
        rowMap.forEach((item) => {
          prevTops.set(item.row, item.row.getBoundingClientRect().top);
        });

        const sortedAfter = after
          .map((probability, index) => ({ probability, index }))
          .sort((a, b) => b.probability - a.probability);

        sortedAfter.forEach(({ index }) => {
          const item = rowMap.get(index);
          if (item) probabilityList.appendChild(item.row);
        });

        rowMap.forEach((item) => {
          const oldTop = prevTops.get(item.row);
          const newTop = item.row.getBoundingClientRect().top;
          const dy = oldTop - newTop;
          if (dy !== 0) {
            item.row.style.transition = 'none';
            item.row.style.transform = `translateY(${dy}px)`;
          }
        });

        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            rowMap.forEach((item) => {
              item.row.style.transition =
                'transform 650ms cubic-bezier(0.2, 0.8, 0.2, 1), background 300ms ease, border-color 300ms ease, box-shadow 300ms ease';
              item.row.style.transform = '';
            });
          });
        });

        await delay(580);

        phase = 'trained';
        busy = false;
        boxStage.className = 'box-stage done';
        boxStatus.textContent = 'احتمال توکن واقعی با موفقیت بیشتر شد';
        changeNote.textContent =
          'احتمال «' +
          example.target +
          '» ' +
          formatPercent(targetIncrease) +
          ' افزایش پیدا کرد.';
        trainButton.hidden = true;
        nextButton.hidden = false;
        nextButton.textContent =
          currentIndex === EXAMPLES.length - 1 ? 'دیدن نتیجه' : 'نمونه‌ی بعدی';
        resetButton.disabled = false;
      }

      function nextExample() {
        if (busy || phase !== 'trained') return;

        if (currentIndex === EXAMPLES.length - 1) {
          phase = 'complete';
          results.classList.remove('visible');
          sampleCount.textContent =
            formatNumber(EXAMPLES.length) + ' نمونه دیده شد';
          sentenceText.textContent = 'پایان نمونه‌های آموزشی';
          boxStage.className = 'box-stage done';
          boxStatus.textContent = 'با هر نمونه کمی تغییر کردم';
          completeMessage.classList.add('visible');
          return;
        }

        currentIndex += 1;
        logits = [...currentExample().logits];
        targetIncrease = 0;
        probabilityChanges = [];
        phase = 'ready';
        renderReady();
      }

      function resetGame() {
        if (busy) return;
        currentIndex = 0;
        logits = [...EXAMPLES[0].logits];
        targetIncrease = 0;
        probabilityChanges = [];
        phase = 'ready';
        renderReady();
      }

      sendButton.addEventListener('click', sendSentence);
      trainButton.addEventListener('click', train);
      nextButton.addEventListener('click', nextExample);
      resetButton.addEventListener('click', resetGame);

      renderReady();
    </script>
  </body>
</html>
