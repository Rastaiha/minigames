<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>پیتزا، همبرگر، قورمه‌سبزی، فرانسه</title>
    <style>
      @font-face {
        font-family: VazirLocal;
        src: url('../fonts/vazir.ttf') format('truetype');
        font-display: swap;
      }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f7f8fc;
        color: #263044;
        font-family: VazirLocal, Tahoma, sans-serif;
      }
      main {
        width: min(960px, 100%);
        padding: clamp(24px, 5vw, 56px);
        background: #fff;
        border: 1px solid #dfe3ee;
        border-radius: 20px;
        box-shadow: 0 20px 60px #35405e14;
      }
      header {
        max-width: 620px;
        margin: 0 auto clamp(24px, 5vw, 48px);
        text-align: center;
      }
      h1 {
        margin: 0;
        font-size: clamp(24px, 4vw, 36px);
        line-height: 1.6;
      }
      header p {
        margin: 8px 0 0;
        color: #69748a;
        font-size: clamp(13px, 2vw, 15px);
        line-height: 2;
      }
      .vectors {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: clamp(10px, 2vw, 24px);
      }
      .word-card {
        min-width: 0;
        padding: 18px 10px;
        border: 1px solid #e4e7ef;
        border-radius: 14px;
        text-align: center;
        background: #fbfcff;
      }
      .word-card h2 {
        margin: 0 0 18px;
        font-size: clamp(17px, 2.5vw, 25px);
        line-height: 1.8;
        overflow-wrap: anywhere;
      }
      .vector {
        direction: ltr;
        display: grid;
        gap: 18px;
        position: relative;
        width: fit-content;
        margin: auto;
        padding: 14px clamp(8px, 2vw, 24px);
        font:
          400 clamp(17px, 3vw, 28px)/1.3 'Courier New',
          monospace;
        font-variant-numeric: tabular-nums;
      }
      .vector::before,
      .vector::after {
        content: '';
        position: absolute;
        top: 0;
        bottom: 0;
        width: 8px;
        border-block: 3px solid #000;
      }
      .vector::before {
        left: 0;
        border-left: 3px solid #000;
      }
      .vector::after {
        right: 0;
        border-right: 3px solid #000;
      }
      .positive {
        color: #1763c4;
      }
      .negative {
        color: #c43232;
      }
      .ellipsis {
        color: #687080;
      }
      .legend {
        display: flex;
        justify-content: center;
        gap: 16px;
        margin-top: 28px;
        color: #69748a;
        font-size: 12px;
      }
      .legend span::before {
        content: '•';
        margin-inline-end: 5px;
      }
      .legend .positive::before {
        color: #1763c4;
      }
      .legend .negative::before {
        color: #c43232;
      }
      @media (max-width: 620px) {
        body {
          padding: 12px;
        }
        main {
          padding: 22px 12px;
          border-radius: 14px;
        }
        .vectors {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .word-card {
          padding: 12px 8px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>واژه‌ها در فضای برداری</h1>
        <p>
          هر ستون یک بُعد از نمایش عددی واژه است؛ مقدارهای مثبت و منفی، جهت‌های
          متفاوت را نشان می‌دهند.
        </p>
      </header>
      <div class="vectors">
        <section class="word-card">
          <h2>پیتزا</h2>
          <div class="vector">
            <span class="positive">1.23</span>
            <span class="positive">0.83</span>
            <span class="negative">-0.67</span>
            <span class="negative">-1.04</span>
            <span class="ellipsis">⋮</span>
          </div>
        </section>
        <section class="word-card">
          <h2>همبرگر</h2>
          <div class="vector">
            <span class="positive">1.18</span>
            <span class="positive">0.91</span>
            <span class="negative">-0.72</span>
            <span class="negative">-0.98</span>
            <span class="ellipsis">⋮</span>
          </div>
        </section>
        <section class="word-card">
          <h2>قورمه‌سبزی</h2>
          <div class="vector">
            <span class="positive">1.06</span>
            <span class="negative">-0.58</span>
            <span class="positive">0.87</span>
            <span class="negative">-0.93</span>
            <span class="ellipsis">⋮</span>
          </div>
        </section>
        <section class="word-card">
          <h2>فرانسه</h2>
          <div class="vector">
            <span class="positive">0.79</span>
            <span class="negative">-1.17</span>
            <span class="positive">1.07</span>
            <span class="negative">-0.69</span>
            <span class="ellipsis">⋮</span>
          </div>
        </section>
      </div>
      <div class="legend" aria-label="راهنمای رنگ‌ها">
        <span class="positive">مقدار مثبت</span>
        <span class="negative">مقدار منفی</span>
      </div>
    </main>
  </body>
</html>
