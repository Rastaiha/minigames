<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fcfaf4">
    <title>آزمایش‌های سیم و ولتاژ</title>
    <link rel="stylesheet" href="./hub.css">
  </head>
  <body>
    <main class="hub-shell">
      <header class="hub-heading">
        <p class="eyebrow">دو آزمایش، یک سیم</p>
        <h1>کدوم آزمایش رو می‌خواین؟</h1>
      </header>

      <nav class="game-paths" aria-label="انتخاب آزمایش">
        <a class="game-path voltage-path" href="./voltage/index.html">
          <span class="path-number" aria-hidden="true">۱</span>
          <strong>ولتاژ را خودتون جابه‌جا کنین</strong>
          <span>اثر تغییر ولتاژ را همون لحظه روی سیم ببینین.</span>
          <span class="path-action">ورود به آزمایش <b aria-hidden="true">←</b></span>
        </a>

        <a class="game-path bandwidth-path" href="./bandwidth/index.html">
          <span class="path-number" aria-hidden="true">۲</span>
          <strong>سرعت فرستادن را عوض کنین</strong>
          <span>ببینین پیام با سرعت‌های مختلف چه شکلی روی سیم حرکت می‌کنه.</span>
          <span class="path-action">ورود به آزمایش <b aria-hidden="true">←</b></span>
        </a>
      </nav>
    </main>

    <script type="module" src="./hub.js"></script>
  </body>
</html>
