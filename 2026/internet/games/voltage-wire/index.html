<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fcfaf4">
    <title>ولتاژ روی سیم</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main class="game-shell">
      <section class="workbench" aria-label="محیط آزمایش ولتاژ">
        <section class="scope-panel" aria-labelledby="scope-label">
          <div class="scope-heading">
            <p id="scope-label" class="panel-label">رد ولتاژ</p>
            <p class="history-note">۸ ثانیهٔ اخیر</p>
          </div>

          <div class="scope-frame">
            <canvas
              id="scope"
              class="scope"
              role="img"
              aria-label="نمودار زندهٔ ولتاژ سیم در هشت ثانیهٔ اخیر"
            >
              مرورگر شما امکان نمایش نمودار زندهٔ ولتاژ را ندارد.
            </canvas>
          </div>
        </section>

        <aside class="control-panel" aria-labelledby="voltage-control-label">
          <div class="control-heading">
            <p id="voltage-control-label" class="panel-label">ولتاژ سیم</p>
            <p class="interaction-cue">لغزنده را جابه‌جا کن</p>
          </div>

          <output class="voltage-readout" for="slider" aria-live="polite" dir="ltr">
            <b id="vLabel">0.00</b>
            <span dir="ltr">V</span>
          </output>

          <div class="slider-area" dir="ltr">
            <div class="voltage-slider">
              <input
                id="slider"
                type="range"
                min="0"
                max="5"
                step="0.01"
                value="0"
                aria-label="تنظیم ولتاژ از صفر تا پنج ولت"
                aria-describedby="range-description"
              >
            </div>
            <div class="voltage-ticks" aria-hidden="true">
              <span>5</span>
              <span>4</span>
              <span>3</span>
              <span>2</span>
              <span>1</span>
              <span>0</span>
            </div>
          </div>

          <ul id="range-description" class="range-key">
            <li class="range-high">
              <span class="range-mark" aria-hidden="true"></span>
              <span>بالا</span>
              <b dir="ltr">3.5–5 V</b>
            </li>
            <li class="range-middle">
              <span class="range-mark" aria-hidden="true"></span>
              <span>میانی</span>
              <b dir="ltr">1.5–3.5 V</b>
            </li>
            <li class="range-low">
              <span class="range-mark" aria-hidden="true"></span>
              <span>پایین</span>
              <b dir="ltr">0–1.5 V</b>
            </li>
          </ul>
        </aside>
      </section>
    </main>

    <script type="module" src="./main.js"></script>
  </body>
</html>
