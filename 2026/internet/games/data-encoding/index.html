<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>انتقال دیتا و اهمیت کلاک</title>

    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>

    <style>
        :root {
            --bg-color: #12121a;
            --panel-bg: #1e1e28;
            --primary: #4e8cff;
            --success: #00ff88;
            --scope-bg: #070a0e;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: var(--bg-color);
            color: #e0e0e0;
            margin: 0;
            padding: 5px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* دکمه‌های حالت */
        .mode-selector {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 5px;
        }

        .mode-btn {
            background: #2a2a35;
            color: #888;
            border: 2px solid transparent;
            padding: 5px 15px;
            border-radius: 15px;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
        }

        .mode-btn.active {
            background: rgba(78, 140, 255, 0.1);
            color: var(--primary);
            border-color: var(--primary);
        }

        /* اسیلوسکوپ */
        .oscilloscope-wrapper {
            background: var(--scope-bg);
            border: 3px solid #333344;
            border-radius: 8px;
            width: 100%;
            height: 22vh;
            min-height: 170px;
            position: relative;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 1);
            display: flex;
            overflow: hidden;
        }

        #canvas-div {
            width: 100%;
            height: 100%;
        }

        /* نوار کنترل زمان */
        .toolbar {
            display: flex;
            justify-content: center;
            background: var(--panel-bg);
            padding: 6px 15px;
            border-radius: 8px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .controls {
            display: flex;
            gap: 8px;
            direction: ltr;
        }

        .controls button {
            background: #333344;
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.95rem;
        }

        .controls button:hover {
            background: var(--primary);
        }

        /* پنل کامپیوترها و کابل فیزیکی */
        .panels {
            display: flex;
            gap: 15px;
            width: 100%;
            direction: ltr;
            align-items: flex-start;
            /* تراز دقیق مانیتورها از بالا */
            justify-content: center;
            padding-top: 10px;
        }

        .computer-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 450px;
        }

        /* کابل‌های فیزیکی واضح و سه‌بعدی */
        .physical-cables {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 80px;
            justify-content: center;
            align-items: center;
            transition: 0.3s;
            margin-top: 60px;
            /* تراز کردن کابل‌ها با وسط مانیتور */
        }

        .cable-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: 4px;
        }

        .cable-label {
            font-size: 0.7rem;
            color: #888;
            font-family: 'Courier New', monospace;
            font-weight: bold;
        }

        .cable-line {
            width: 100%;
            height: 10px;
            border-radius: 5px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.6), inset 0 2px 4px rgba(255, 255, 255, 0.2);
        }

        .cable-data {
            background: #4e8cff;
        }

        .cable-clk {
            background: #a0a0b0;
        }

        /* برای مخفی کردن کانتینر کلاک در حالت ۱ */
        #clkCableDOM {
            display: none;
        }

        /* مانیتورها */
        .monitor-frame {
            background: #dcdde1;
            border-radius: 8px;
            padding: 8px;
            width: 100%;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            border: 2px solid #b2bec3;
            position: relative;
        }

        .monitor-screen {
            background: #0a0a0f;
            border-radius: 4px;
            min-height: 110px;
            padding: 8px;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            border: 2px solid #2d3436;
        }

        .monitor-stand {
            background: linear-gradient(to bottom, #b2bec3, #7f8fa6);
            width: 40px;
            height: 15px;
        }

        .monitor-base {
            background: #7f8fa6;
            width: 90px;
            height: 6px;
            border-radius: 3px 3px 0 0;
        }

        .comp-label {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--panel-bg);
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 0.75rem;
            color: white;
            font-weight: bold;
            border: 2px solid #555;
            direction: rtl;
        }

        .tx-label {
            border-color: var(--primary);
            color: var(--primary);
        }

        .rx-label {
            border-color: var(--success);
            color: var(--success);
        }

        /* ورودی فرستنده */
        .input-group {
            display: flex;
            gap: 5px;
            margin-bottom: 8px;
            direction: rtl;
        }

        .input-group input {
            flex: 1;
            padding: 4px;
            border-radius: 4px;
            border: 1px solid #444;
            background: #1e1e28;
            color: var(--primary);
            font-family: 'Vazirmatn', monospace;
            text-align: center;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .btn-send {
            background: var(--primary);
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 4px;
            font-family: 'Vazirmatn';
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-send:hover {
            background: #3a6ecc;
        }

        /* باینری و متن‌ها */
        .binary-display {
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            letter-spacing: 2px;
            word-break: break-all;
            direction: ltr;
            text-align: left;
            flex: 1;
            line-height: 1.5;
        }

        .byte-block {
            display: inline-block;
            margin-right: 8px;
        }

        .active-tx-bit {
            background: rgba(255, 255, 255, 0.9);
            color: black !important;
            padding: 0 1px;
            border-radius: 2px;
            font-weight: bold;
        }

        @keyframes popIn {
            0% {
                transform: scale(1.5);
                opacity: 0;
                color: white;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .new-rx-bit {
            animation: popIn 0.2s ease-out forwards;
            font-weight: bold;
            background: rgba(0, 255, 136, 0.3);
        }

        /* تنظیمات گیرنده (اسلایدرهای تراز شده) */
        .rx-settings {
            background: #1e1e28;
            padding: 8px 12px;
            border-radius: 6px;
            margin-top: 10px;
            width: 100%;
            border: 1px solid #444;
            direction: rtl;
            transition: opacity 0.3s;
        }

        .rx-settings.disabled {
            opacity: 0.3;
            pointer-events: none;
        }

        .slider-row {
            display: flex;
            align-items: center;
            gap: 10px;
            /* فاصله ثابت بین المان‌ها */
            margin-top: 5px;
            font-size: 0.75rem;
        }

        .slider-label {
            width: 120px;
            /* عرض ثابت برای تراز ماندن اسلایدرها */
            text-align: right;
            color: #bbb;
        }

        input[type="range"] {
            flex: 1;
            /* پر کردن فضای باقی‌مانده */
            margin: 0;
            accent-color: var(--success);
        }

        .val-badge {
            width: 45px;
            /* عرض ثابت برای نمایش عدد */
            text-align: center;
            background: #000;
            padding: 2px 0;
            border-radius: 3px;
            color: var(--success);
            font-family: monospace;
        }

        .final-text {
            text-align: center;
            font-size: 1.1rem;
            color: var(--success);
            font-weight: bold;
            margin-top: 5px;
        }

        /* ریسپانسیو برای گوشی */
        @media (max-width: 768px) {
            .panels {
                flex-direction: column;
                gap: 20px;
                align-items: center;
            }

            .oscilloscope-wrapper {
                height: 180px;
            }

            .physical-cables {
                flex-direction: row;
                width: auto;
                height: auto;
                margin-top: 0;
            }

            .cable-container {
                width: auto;
            }

            .cable-line {
                width: 60px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="mode-selector">
            <button class="mode-btn active" id="btnMode1" onclick="setMode(1)">حالت ۱: کلاک از پیش تنظیم شده
                (Async)</button>
            <button class="mode-btn" id="btnMode2" onclick="setMode(2)">حالت ۲: ارسال کلاک با سیم مجزا (Sync)</button>
        </div>

        <div class="oscilloscope-wrapper">
            <div id="canvas-div"></div>
        </div>

        <div class="toolbar">
            <div class="controls">
                <button id="btnPrev" title="یک پالس عقب">⏪</button>
                <button id="btnPlayPause" title="توقف/پخش">▶️</button>
                <button id="btnNext" title="یک پالس جلو">⏩</button>
                <button id="btnReset" title="شروع مجدد">🔄</button>
            </div>
        </div>

        <div class="panels">
            <!-- فرستنده -->
            <div class="computer-wrapper">
                <div class="monitor-frame">
                    <div class="comp-label tx-label">💻 فرستنده (TX)</div>
                    <div class="monitor-screen">
                        <div class="input-group">
                            <input type="text" id="textInput" placeholder="متن..." value="Hi" maxlength="12">
                            <button class="btn-send" id="btnSend">ارسال</button>
                        </div>
                        <div class="binary-display" id="sentBinary">
                            <span style="color:#666; font-size:0.75rem; direction:rtl; display:block;">آماده
                                ارسال...</span>
                        </div>
                    </div>
                </div>
                <div class="monitor-stand"></div>
                <div class="monitor-base"></div>
            </div>

            <!-- کابل‌های فیزیکی بین کامپیوترها -->
            <div class="physical-cables">
                <div class="cable-container">
                    <span class="cable-label">Data</span>
                    <div class="cable-line cable-data" title="کابل داده"></div>
                </div>
                <div class="cable-container" id="clkCableDOM">
                    <span class="cable-label">Clock</span>
                    <div class="cable-line cable-clk" title="کابل کلاک"></div>
                </div>
            </div>

            <!-- گیرنده -->
            <div class="computer-wrapper">
                <div class="monitor-frame">
                    <div class="comp-label rx-label">🖥️ گیرنده (RX)</div>
                    <div class="monitor-screen">
                        <div class="binary-display" id="receivedBinary"></div>
                        <div class="final-text" id="receivedText">-</div>
                    </div>
                </div>
                <div class="monitor-stand"></div>
                <div class="monitor-base"></div>

                <!-- تنظیمات گیرنده با اسلایدرهای تراز شده -->
                <div class="rx-settings" id="rxSettings">
                    <div class="slider-row">
                        <span class="slider-label">خطای سرعت (Drift):</span>
                        <input type="range" id="driftSlider" min="0.8" max="1.2" step="0.01" value="1">
                        <span class="val-badge" id="driftValue">1.00x</span>
                    </div>
                    <div class="slider-row">
                        <span class="slider-label">آفست زمانی (Phase):</span>
                        <input type="range" id="offsetSlider" min="-0.5" max="0.5" step="0.05" value="0">
                        <span class="val-badge" id="offsetValue">0.00</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let mode = 1;
        let binaryData = "";
        let isPlaying = false;
        let hasStarted = false;

        let globalTime = 0;
        let speed = 1.2;
        let bitDuration = 45;

        let canvasW, canvasH;
        let txX = 70; // افزایش مقدار برای جا شدن بهتر لیبل‌های ولتاژ اسیلوسکوپ
        let rxMargin = 60;

        const byteColors = ['#00ffcc', '#ff3366', '#ffcc00', '#cc33ff', '#3399ff', '#ff6633', '#00ff44', '#ff33cc'];
        let ripples = [];
        let lastSampledIndexForUI = -1;

        function stringToBinary(str) {
            let bin = "";
            for (let i = 0; i < str.length; i++) {
                bin += str.charCodeAt(i).toString(2).padStart(8, '0');
            }
            return bin;
        }

        function renderTxBinary(binStr, activeIndex) {
            if (!binStr) return "";
            let html = "";
            let bytes = binStr.match(/.{1,8}/g) || [];
            let globalBitIdx = 0;

            bytes.forEach((byteStr, i) => {
                let color = byteColors[i % byteColors.length];
                html += `<span class="byte-block" style="color:${color}">`;
                for (let b = 0; b < 8; b++) {
                    let c = byteStr[b];
                    if (globalBitIdx === activeIndex) {
                        html += `<span class="active-tx-bit">${c}</span>`;
                    } else {
                        html += c;
                    }
                    globalBitIdx++;
                }
                html += `</span>`;
            });
            return html;
        }

        function renderRxBinary(binStr) {
            if (!binStr) return "";
            let html = "";
            let globalBitIdx = 0;
            let bytes = binStr.match(/.{1,8}/g) || [];

            bytes.forEach((byteStr, i) => {
                let color = byteColors[i % byteColors.length];
                html += `<span class="byte-block" style="color:${color}">`;
                for (let b = 0; b < byteStr.length; b++) {
                    let c = byteStr[b];
                    if (globalBitIdx === binStr.length - 1) {
                        html += `<span class="new-rx-bit">${c}</span>`;
                    } else {
                        html += c;
                    }
                    globalBitIdx++;
                }
                html += `</span>`;
            });
            return html;
        }

        document.getElementById('textInput').addEventListener('input', function (e) {
            this.value = this.value.replace(/[^\x00-\x7F]/g, '');
        });

        function setMode(m) {
            mode = m;
            document.getElementById('btnMode1').classList.remove('active');
            document.getElementById('btnMode2').classList.remove('active');
            document.getElementById('btnMode' + m).classList.add('active');

            if (mode === 2) {
                document.getElementById('rxSettings').classList.add('disabled');
                document.getElementById('clkCableDOM').style.display = 'flex';
            } else {
                document.getElementById('rxSettings').classList.remove('disabled');
                document.getElementById('clkCableDOM').style.display = 'none';
            }
        }

        document.getElementById('btnSend').addEventListener('click', startTransmission);

        document.getElementById('btnPlayPause').addEventListener('click', () => {
            if (hasStarted) isPlaying = !isPlaying;
            document.getElementById('btnPlayPause').innerText = isPlaying ? "⏸️" : "▶️";
        });

        document.getElementById('btnNext').addEventListener('click', () => {
            if (hasStarted) { isPlaying = false; document.getElementById('btnPlayPause').innerText = "▶️"; globalTime += (bitDuration / 2); }
        });
        document.getElementById('btnPrev').addEventListener('click', () => {
            if (hasStarted) { isPlaying = false; document.getElementById('btnPlayPause').innerText = "▶️"; globalTime = Math.max(0, globalTime - (bitDuration / 2)); }
        });

        document.getElementById('btnReset').addEventListener('click', () => {
            isPlaying = false;
            hasStarted = false;
            globalTime = 0;
            ripples = [];
            lastSampledIndexForUI = -1;
            document.getElementById('btnPlayPause').innerText = "▶️";
            document.getElementById('sentBinary').innerHTML = '<span style="color:#666; font-size:0.75rem; direction:rtl; display:block;">آماده ارسال...</span>';
            document.getElementById('receivedBinary').innerHTML = "";
            document.getElementById('receivedText').innerText = "-";
        });

        document.getElementById('driftSlider').addEventListener('input', e => document.getElementById('driftValue').innerText = parseFloat(e.target.value).toFixed(2) + "x");
        document.getElementById('offsetSlider').addEventListener('input', e => document.getElementById('offsetValue').innerText = parseFloat(e.target.value).toFixed(2));

        function startTransmission() {
            let txt = document.getElementById('textInput').value || "A";
            binaryData = stringToBinary(txt);

            globalTime = 0;
            hasStarted = true;
            isPlaying = true;
            ripples = [];
            lastSampledIndexForUI = -1;

            document.getElementById('btnPlayPause').innerText = "⏸️";
            document.getElementById('receivedBinary').innerHTML = "";
            document.getElementById('receivedText').innerText = "-";
        }

        // ==========================================
        // موتور رسم p5.js
        // ==========================================
        function setup() {
            let container = document.getElementById('canvas-div');
            canvasW = container.offsetWidth;
            canvasH = container.offsetHeight;
            let cvs = createCanvas(canvasW, canvasH);
            cvs.parent('canvas-div');
            textFont('Vazirmatn');
        }

        function windowResized() {
            let container = document.getElementById('canvas-div');
            canvasW = container.offsetWidth;
            canvasH = container.offsetHeight;
            resizeCanvas(canvasW, canvasH);
        }

        function draw() {
            background(7, 10, 14);
            drawScopeGrid();
            drawPortsAndCables();

            if (!hasStarted) {
                drawIdleState();
                return;
            }

            if (isPlaying) globalTime += 1;

            updateTxUI();
            drawSignals();
            processReceiver();
            drawRipples();
        }

        function drawScopeGrid() {
            stroke(19, 36, 32);
            strokeWeight(1);
            let gridSize = 30;
            for (let x = 0; x < width; x += gridSize) line(x, 0, x, height);
            for (let y = 0; y < height; y += gridSize) line(0, y, width, y);

            let dataTop = canvasH * 0.25;
            let dataBot = canvasH * 0.5;

            stroke(255, 255, 255, 40); drawingContext.setLineDash([2, 4]);
            line(0, dataTop, width, dataTop); line(0, dataBot, width, dataBot);
            drawingContext.setLineDash([]);

            // باکس بک‌گراند مشکی برای خوانایی متن - عرض تنظیم شده تا با موج تداخل نکند
            fill(0, 0, 0, 220); noStroke();
            rect(5, dataTop - 10, 52, 20, 4);
            rect(5, dataBot - 10, 52, 20, 4);

            fill('#4e8cff'); textAlign(CENTER, CENTER); textSize(11);
            text("Data 5V", 31, dataTop);
            text("Data 0V", 31, dataBot);

            if (mode === 2) {
                let clkTop = canvasH * 0.75;
                let clkBot = canvasH * 0.95;

                stroke(255, 255, 255, 40); drawingContext.setLineDash([2, 4]);
                line(0, clkTop, width, clkTop); line(0, clkBot, width, clkBot);
                drawingContext.setLineDash([]);

                fill(0, 0, 0, 220); noStroke();
                rect(5, clkTop - 10, 52, 20, 4);
                rect(5, clkBot - 10, 52, 20, 4);

                fill('#a0a0b0');
                text("Clk 5V", 31, clkTop);
                text("Clk 0V", 31, clkBot);
            }
        }

        function drawPortsAndCables() {
            let rxX = canvasW - rxMargin;
            let dataMid = canvasH * 0.375;
            let clkMid = canvasH * 0.85;

            strokeWeight(5);
            stroke('#4e8cff');
            line(0, dataMid, txX, dataMid);
            stroke('#00ff88');
            line(rxX, dataMid, canvasW, dataMid);

            if (mode === 2) {
                stroke('#a0a0b0');
                line(0, clkMid, txX, clkMid);
                line(rxX, clkMid, canvasW, clkMid);
            }

            noStroke(); fill('#333344');
            rect(txX - 10, 0, 10, height);
            rect(rxX, 0, 10, height);

            fill('#4e8cff');
            rect(txX - 10, dataMid - 8, 10, 16, 2);
            rect(rxX, dataMid - 8, 10, 16, 2);

            if (mode === 2) {
                fill('#a0a0b0');
                rect(txX - 10, clkMid - 8, 10, 16, 2);
                rect(rxX, clkMid - 8, 10, 16, 2);
            }
        }

        function drawIdleState() {
            fill(100); noStroke(); textAlign(CENTER, CENTER); textSize(13);
            text("سیگنالی در سیم وجود ندارد...", width / 2, height / 2 - 20);
        }

        function getVoltageAtPixel(x, type) {
            if (x < txX) return { v: null, index: -1 };

            let dist = x - txX;
            let timeGenerated = globalTime - (dist / speed);

            let v0 = (type === 'data') ? canvasH * 0.5 : canvasH * 0.95;
            let v5 = (type === 'data') ? canvasH * 0.25 : canvasH * 0.75;

            if (timeGenerated < 0 || timeGenerated >= binaryData.length * bitDuration) {
                return { v: v0, index: -1 };
            }

            let bitIndex = Math.floor(timeGenerated / bitDuration);
            if (type === 'data') {
                let bitVal = parseInt(binaryData[bitIndex]);
                return { v: (bitVal === 1 ? v5 : v0), index: bitIndex };
            } else {
                let phase = timeGenerated % bitDuration;
                return { v: (phase < bitDuration / 2 ? v0 : v5), index: bitIndex };
            }
        }

        function drawSignals() {
            let rxX = canvasW - rxMargin;

            noFill(); strokeWeight(3);
            let prevIndex = -2;
            let prevV = null;
            let currentPath = [];

            for (let x = txX; x <= rxX; x += 1) {
                let p = getVoltageAtPixel(x, 'data');

                if (p.index !== prevIndex || x === rxX) {
                    if (currentPath.length > 0) {
                        let byteIndex = Math.floor(prevIndex / 8);
                        let col = (prevIndex === -1) ? '#555555' : byteColors[byteIndex % byteColors.length];

                        stroke(col);
                        beginShape();
                        for (let pt of currentPath) vertex(pt.x, pt.y);
                        endShape();
                    }
                    currentPath = [];
                    if (prevV !== null && p.v !== prevV && x !== rxX) {
                        currentPath.push({ x: x, y: prevV });
                    }
                }

                currentPath.push({ x: x, y: p.v });
                prevIndex = p.index;
                prevV = p.v;
            }

            if (mode === 2) {
                stroke('#a0a0b0'); strokeWeight(2);
                let clkPrevV = null;
                beginShape();
                for (let x = txX; x <= rxX; x += 1) {
                    let p = getVoltageAtPixel(x, 'clock');
                    if (clkPrevV !== null && p.v !== clkPrevV && x !== txX) {
                        vertex(x, clkPrevV);
                    }
                    vertex(x, p.v);
                    clkPrevV = p.v;
                }
                endShape();
            }

            drawBitValuesOnWire(rxX);
        }

        function drawBitValuesOnWire(rxX) {
            let totalBits = binaryData.length;
            for (let i = 0; i < totalBits; i++) {
                let timeGenerated = i * bitDuration;
                let xStart = txX + ((globalTime - timeGenerated) * speed);
                let xEnd = txX + ((globalTime - (i + 1) * bitDuration) * speed);

                if (xStart > txX && xEnd < rxX) {
                    let midX = (xStart + xEnd) / 2;
                    let byteIndex = Math.floor(i / 8);
                    fill(byteColors[byteIndex % byteColors.length]);
                    noStroke(); textSize(13); textAlign(CENTER, BOTTOM);
                    text(binaryData[i], midX, (canvasH * 0.25) - 6);
                }
            }
        }

        function updateTxUI() {
            let p = getVoltageAtPixel(txX + 1, 'data');
            document.getElementById('sentBinary').innerHTML = renderTxBinary(binaryData, p.index);
        }

        function processReceiver() {
            let rxX = canvasW - rxMargin;
            let drift = parseFloat(document.getElementById('driftSlider').value);
            let offset = parseFloat(document.getElementById('offsetSlider').value);

            let arrivalTimeOfFirstBit = (rxX - txX) / speed;
            let sampledBits = "";
            let justSampledNow = false;

            let rxBitDuration = mode === 1 ? (bitDuration / drift) : bitDuration;

            let offsetVisualX = rxX;
            if (mode === 1) {
                offsetVisualX = rxX - (offset * rxBitDuration * speed);
            }

            stroke('#ff4757'); strokeWeight(2); drawingContext.setLineDash([4, 4]);
            line(offsetVisualX, 0, offsetVisualX, height);
            drawingContext.setLineDash([]);

            fill('#ff4757'); noStroke();
            triangle(offsetVisualX - 6, 10, offsetVisualX + 6, 10, offsetVisualX, 20);

            for (let i = 0; i < binaryData.length; i++) {
                let sampleTime;
                if (mode === 1) {
                    sampleTime = arrivalTimeOfFirstBit + (i + 0.5 + offset) * rxBitDuration;
                } else {
                    sampleTime = arrivalTimeOfFirstBit + (i + 0.5) * bitDuration;
                }

                if (globalTime >= sampleTime) {
                    let genTimeAtSample = sampleTime - arrivalTimeOfFirstBit;
                    let targetBitIndex = Math.floor(genTimeAtSample / bitDuration);

                    let sampled = "0";
                    if (targetBitIndex >= 0 && targetBitIndex < binaryData.length) {
                        sampled = binaryData[targetBitIndex];
                    }
                    sampledBits += sampled;

                    if (sampledBits.length > lastSampledIndexForUI) {
                        lastSampledIndexForUI = sampledBits.length;
                        justSampledNow = true;

                        let sampleY = parseInt(sampled) === 1 ? (canvasH * 0.25) : (canvasH * 0.5);
                        ripples.push({ x: offsetVisualX, y: sampleY, radius: 4, alpha: 255, val: sampled });
                    }
                }
            }

            if (justSampledNow || globalTime % 10 === 0) {
                document.getElementById('receivedBinary').innerHTML = renderRxBinary(sampledBits);

                let textOut = "";
                for (let i = 0; i < sampledBits.length; i += 8) {
                    let byte = sampledBits.substring(i, i + 8);
                    if (byte.length === 8) textOut += String.fromCharCode(parseInt(byte, 2));
                }
                document.getElementById('receivedText').innerText = textOut || "-";
            }
        }

        function drawRipples() {
            for (let i = ripples.length - 1; i >= 0; i--) {
                let r = ripples[i];
                noFill(); stroke(0, 255, 136, r.alpha); strokeWeight(2);
                circle(r.x, r.y, r.radius);

                fill(0, 255, 136, r.alpha); noStroke(); textSize(16); textAlign(CENTER, CENTER);
                text(r.val, r.x - 18, r.y - 18);

                r.radius += 1;
                r.alpha -= 8;
                if (r.alpha <= 0) ripples.splice(i, 1);
            }
        }
    </script>
