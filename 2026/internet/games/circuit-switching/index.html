<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>بازی سوییچینگ مداری</title>
    <style>
        :root {
            --canvas: #FCFAF4;
            --ink: #2C2318;
            --soft-ink: #6B5D4A;
            --line: rgba(44, 35, 24, 0.18);
            --line-strong: rgba(44, 35, 24, 0.42);
            --crimson: #B82A31;
            --gold: #E8B33A;
            --turquoise: #35AFB8;
            --blue: #5669D1;
            --green: #3C9468;
            --tint-crimson: rgba(184, 42, 49, 0.10);
            --tint-crimson-strong: rgba(184, 42, 49, 0.24);
            --tint-gold: rgba(232, 179, 58, 0.22);
            --tint-gold-strong: rgba(232, 179, 58, 0.44);
            --tint-turquoise: rgba(53, 175, 184, 0.16);
            --tint-turquoise-strong: rgba(53, 175, 184, 0.32);
            --tint-blue: rgba(86, 105, 209, 0.14);
            --tint-blue-strong: rgba(86, 105, 209, 0.30);
            --tint-green: rgba(60, 148, 104, 0.16);
        }

        html {
            background: var(--canvas);
        }

        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--canvas);
            background-image:
                radial-gradient(circle at 12px 12px, rgba(44, 35, 24, 0.055) 1.3px, transparent 1.4px);
            background-size: 28px 28px;
            color: var(--ink);
            font-family: "Vazirmatn Variable", Vazirmatn, Tahoma, Arial, sans-serif;
            overflow: hidden;
            position: fixed;
            user-select: none;
            -webkit-user-select: none;
        }

        #game-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        #ui-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 50;
        }

        .btn {
            pointer-events: auto;
            background: var(--canvas);
            color: var(--ink);
            border: 1.5px solid var(--line-strong);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font: inherit;
            font-size: clamp(14px, 2vw, 16px);
            font-weight: 800;
            transition: background 160ms ease, transform 100ms ease, border-color 160ms ease;
            z-index: 100;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:hover:not(:disabled) {
            background: var(--tint-turquoise);
            border-color: var(--turquoise);
        }
        .btn:active { transform: scale(0.96); }
        .btn:disabled {
            background: rgba(44, 35, 24, 0.06);
            color: var(--soft-ink);
            border-color: var(--line);
            cursor: not-allowed;
        }

        #btn-start:not(:disabled) {
            background: var(--turquoise);
            color: var(--ink);
            border-color: var(--ink);
            animation: start-pulse 1.6s ease-in-out infinite;
        }
        @keyframes start-pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(53, 175, 184, 0.45); }
            50%      { box-shadow: 0 0 0 12px rgba(53, 175, 184, 0); }
        }

        #controls {
            position: absolute;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            pointer-events: auto;
            width: min(94%, 640px);
            justify-content: center;
            flex-wrap: wrap;
            padding: 10px 14px;
            border-radius: 14px;
            background: rgba(252, 250, 244, 0.88);
            border: 1px solid var(--line);
            box-shadow: 0 4px 14px rgba(44, 35, 24, 0.08);
        }

        #top-center {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
            width: 90%;
        }

        #top-left {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 50vh;
            overflow-y: auto;
            pointer-events: auto;
            scrollbar-width: none;
        }
        #top-left::-webkit-scrollbar { display: none; }

        .req-card {
            background: var(--canvas);
            border: 1.5px solid var(--line);
            padding: clamp(8px, 1.5vw, 15px);
            border-radius: 10px;
            text-align: center;
            pointer-events: auto;
            box-shadow: 0 2px 6px rgba(44, 35, 24, 0.08);
            font-size: clamp(12px, 1.5vw, 14px);
            direction: ltr;
            color: var(--ink);
        }

        .req-card.active {
            border-color: var(--blue);
            background: var(--tint-blue);
        }

        .req-card.completed {
            border-color: var(--crimson);
            background: var(--tint-crimson);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            min-width: 140px;
        }

        #modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: var(--canvas);
            border: 2px solid var(--blue);
            padding: clamp(20px, 4vw, 30px);
            border-radius: 14px;
            text-align: center;
            pointer-events: auto;
            transition: transform 0.3s ease-out;
            box-shadow: 0 8px 24px rgba(44, 35, 24, 0.16);
            z-index: 200;
            font-size: clamp(16px, 3vw, 20px);
            direction: ltr;
            color: var(--ink);
        }
        #modal.show { transform: translate(-50%, -50%) scale(1); }

        #toast {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translate(-50%, -20px);
            background: var(--crimson);
            color: var(--canvas);
            padding: 12px 18px;
            border-radius: 10px;
            font-size: clamp(13px, 1.7vw, 15px);
            font-weight: 700;
            z-index: 250;
            opacity: 0;
            pointer-events: none;
            transition: opacity 220ms ease, transform 220ms ease;
            max-width: min(92vw, 520px);
            text-align: center;
            box-shadow: 0 6px 18px rgba(44, 35, 24, 0.24);
            line-height: 1.6;
        }
        #toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        svg#links {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        .edge {
            stroke: var(--soft-ink);
            stroke-width: clamp(2px, 0.8vw, 4px);
            stroke-linecap: round;
            transition: stroke 0.3s, stroke-width 0.3s, opacity 0.18s, stroke-dasharray 0.18s;
        }
        .edge.occupied {
            stroke: var(--crimson);
            stroke-width: clamp(5px, 1.5vw, 8px);
        }
        .edge.occupied.idle {
            opacity: 0.38;
            stroke-dasharray: 9 7;
        }
        .edge.drawing {
            stroke: var(--blue);
            stroke-width: clamp(4px, 1.2vw, 6px);
            stroke-dasharray: 10;
            animation: dash 1s linear infinite;
        }
        @keyframes dash { to { stroke-dashoffset: -20; } }

        .edge-idle-label {
            fill: var(--crimson);
            stroke: var(--canvas);
            stroke-width: 3;
            paint-order: stroke fill;
            font-family: "Vazirmatn Variable", Vazirmatn, sans-serif;
            font-size: clamp(10px, 1.4vw, 13px);
            font-weight: 800;
            text-anchor: middle;
            dominant-baseline: middle;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.18s ease;
        }
        .edge-idle-label.visible { opacity: 1; }

        .packet-body {
            fill: var(--gold);
            stroke: var(--ink);
            stroke-width: 1.3;
        }
        .packet-flap {
            fill: none;
            stroke: var(--ink);
            stroke-width: 0.9;
            opacity: 0.7;
        }
        .packet { pointer-events: none; }

        #nodes-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
            pointer-events: none;
        }

        .node {
            position: absolute;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: clamp(10px, 1.5vw, 13px);
            cursor: pointer;
            pointer-events: auto;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s, background 0.2s;
            direction: rtl;
            touch-action: manipulation;
            text-align: center;
            line-height: 1.2;
            -webkit-tap-highlight-color: transparent;
        }

        .node.terminal {
            width: clamp(80px, 12vw, 104px);
            height: clamp(58px, 9.5vw, 74px);
            background: var(--ink);
            border-radius: 8px;
            padding: 5px 6px 10px 6px;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(44, 35, 24, 0.16);
            gap: 0;
            flex-direction: column;
        }

        .node.terminal::before {
            content: '';
            position: absolute;
            inset: 5px 5px 11px 5px;
            background: #F1D38E;
            border-radius: 4px;
            z-index: 0;
            transition: background 200ms ease;
        }

        .node.terminal::after {
            content: '';
            position: absolute;
            bottom: 4px;
            left: 50%;
            width: 16px;
            height: 2px;
            transform: translateX(-50%);
            background: rgba(252, 250, 244, 0.38);
            border-radius: 1px;
            z-index: 0;
        }

        .term-name {
            position: relative;
            z-index: 1;
            font-size: 0.72em;
            font-weight: 700;
            color: var(--ink);
            opacity: 0.72;
            line-height: 1;
            margin-bottom: 1px;
        }

        .term-num {
            position: relative;
            z-index: 1;
            font-size: 1.55em;
            font-weight: 900;
            color: var(--ink);
            line-height: 1;
        }

        .node.switch {
            width: clamp(66px, 10vw, 86px);
            height: clamp(66px, 10vw, 86px);
            background: var(--tint-turquoise);
            border: 4px double var(--ink);
            border-radius: 50%;
            color: var(--ink);
            overflow: visible;
            box-shadow: 0 2px 6px rgba(44, 35, 24, 0.14);
        }

        .switch-inner {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: visible;
        }

        .switch-chip {
            fill: none;
            stroke: var(--ink);
            stroke-width: 1;
            stroke-dasharray: 2 3;
            opacity: 0.32;
        }

        .switch-trace {
            stroke: var(--ink);
            stroke-width: 0.7;
            stroke-dasharray: 1.5 2;
            opacity: 0.35;
            stroke-linecap: round;
        }

        .switch-port {
            fill: var(--canvas);
            stroke: var(--ink);
            stroke-width: 1.5;
            transition: fill 200ms ease, stroke 200ms ease;
        }
        .switch-port.active {
            fill: var(--crimson);
            stroke: var(--ink);
        }

        .switch-inner-wire {
            stroke: var(--crimson);
            stroke-width: 3.5;
            stroke-linecap: round;
            fill: none;
            stroke-dasharray: 6 4;
            animation: switch-wire-flow 800ms linear infinite;
            opacity: 0.92;
        }
        @keyframes switch-wire-flow { to { stroke-dashoffset: -10; } }

        .switch-label {
            position: relative;
            z-index: 3;
            font-size: clamp(9px, 1.1vw, 11px);
            line-height: 1.1;
            font-weight: 800;
            pointer-events: none;
            padding: 2px 5px;
            background: rgba(252, 250, 244, 0.82);
            border-radius: 4px;
        }

        .node:hover { transform: translate(-50%, -50%) scale(1.06); }

        .node.selected {
            box-shadow: 0 0 0 3px var(--tint-blue-strong), 0 2px 6px rgba(44, 35, 24, 0.14);
        }
        .node.switch.selected {
            border-color: var(--blue);
            background: var(--tint-blue);
        }
        .node.terminal.selected::before { background: #B5BEEA; }

        .node.hint-source {
            animation: hint-source-pulse 1.6s ease-in-out infinite;
        }
        @keyframes hint-source-pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(86, 105, 209, 0.5), 0 2px 6px rgba(44, 35, 24, 0.14); }
            50%      { box-shadow: 0 0 0 12px rgba(86, 105, 209, 0), 0 2px 6px rgba(44, 35, 24, 0.14); }
        }

        .node.hint-target {
            box-shadow: 0 0 0 3px var(--tint-turquoise-strong), 0 2px 6px rgba(44, 35, 24, 0.14);
        }
        .node.switch.hint-target { border-color: var(--turquoise); }
        .node.terminal.hint-target::before { background: #A8DBE0; }

        @media (max-width: 768px) {
            #top-left { top: 80px; left: 10px; }
            #controls { bottom: max(28px, env(safe-area-inset-bottom) + 16px); gap: 10px; }
            .btn { padding: 8px 12px; font-size: 13px; }
            .node { font-size: 10px; }
            .switch-label { font-size: 9px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>

<div id="game-container">
    <svg id="links"></svg>
    <div id="nodes-container"></div>

    <div id="ui-layer">
        <div id="top-left"></div>
        <div id="top-center"></div>
        <div id="toast" role="status" aria-live="polite"></div>

        <div id="modal">
            <div id="modal-text"></div>
        </div>

        <div id="controls">
            <button class="btn" id="btn-start">شروع</button>
            <button class="btn" id="btn-undo" disabled>بازگشت</button>
            <button class="btn" id="btn-restart">شروع مجدد</button>
        </div>
    </div>
</div>

<script type="module" src="./main.js"></script>

</body>
</html>
